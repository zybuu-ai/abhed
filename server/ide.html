<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhed</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="stylesheet" href="/ide/vendor/xterm.css">
<link rel="stylesheet" href="/ide/vendor/editor.css">
<script src="/ide/vendor/editor.js"></script>
<script src="/ide/vendor/xterm.js"></script>
<script src="/ide/vendor/addon-fit.js"></script>
<style>
/*{{BRAND_CSS}}*/
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --raised:#FFFFFF; --sunken:#F1F1EE; --chrome:#F1F1EE;
  --line:#E5E5E0; --line-strong:#D2D2CC;
  --ink:#0B0B0C; --ink-2:#3A3A40; --muted:#6B6B72;
  --accent:#C2410C; --accent-soft:#FFF0E8;
  --ok:#1A7F4B; --ok-bg:#E3F3EA; --warn:#9A6A16; --warn-bg:#FAF0DC; --bad:#C0392F; --bad-bg:#FBE9E7;
  --add:#1A7F4B; --add-bg:#E6F4EC; --del:#B3362C; --del-bg:#FBEAE8; --hunk-bg:#FFF0E8;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,Roboto,sans-serif;
  --side:280px; --agent:420px; --panel:220px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0C; --surface:#141416; --raised:#1C1C1F; --sunken:#0B0B0C; --chrome:#141416;
    --line:#2A2A2F; --line-strong:#3A3A40;
    --ink:#F2F2EE; --ink-2:#C8C8C3; --muted:#9B9BA3;
    --accent:#FF7A45; --accent-soft:#2A1A12;
    --ok:#3FAF6C; --ok-bg:#0F2419; --warn:#D4A03C; --warn-bg:#241C0C; --bad:#E05A52; --bad-bg:#2A1412;
    --add:#56C486; --add-bg:#0E2418; --del:#F0736A; --del-bg:#2A1311; --hunk-bg:#2A1A12;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#141416; --raised:#1C1C1F; --sunken:#0B0B0C; --chrome:#141416;
  --line:#2A2A2F; --line-strong:#3A3A40;
  --ink:#F2F2EE; --ink-2:#C8C8C3; --muted:#9B9BA3;
  --accent:#FF7A45; --accent-soft:#2A1A12;
  --ok:#3FAF6C; --ok-bg:#0F2419; --warn:#D4A03C; --warn-bg:#241C0C; --bad:#E05A52; --bad-bg:#2A1412;
  --add:#56C486; --add-bg:#0E2418; --del:#F0736A; --del-bg:#2A1311; --hunk-bg:#2A1A12;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}

/* ------------------------------------------------------------ shell */
#app{display:grid;height:100%;grid-template-rows:38px minmax(0,1fr) 24px;
  grid-template-columns:48px var(--side) 4px minmax(0,1fr) 4px var(--agent)}
#app.noside{grid-template-columns:48px 0 0 minmax(0,1fr) 4px var(--agent)}
#app.noside #side,#app.noside #split-side{display:none}
#title{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
#title .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em}
#title .brand .lockup img{height:20px}
#title .brand .lockup .lk-word{height:14px}
#title .ws{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palette-open{margin:0 auto;display:flex;align-items:center;gap:8px;min-width:0;width:min(440px,40vw);height:26px;padding:0 10px;
  border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);font-size:12px}
#palette-open kbd{margin-left:auto}
kbd{font:11px var(--mono);padding:1px 5px;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted);background:var(--sunken)}
#title .right{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--muted)}
#title a{color:var(--muted);text-decoration:none}#title a:hover{color:var(--ink)}

#act{grid-row:2;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
#act button{width:40px;height:40px;display:grid;place-items:center;border-radius:6px;color:var(--muted);position:relative}
#act button svg{width:20px;height:20px}
#act button:hover{color:var(--ink);background:var(--sunken)}
#act button[aria-pressed="true"]{color:var(--accent)}
#act button[aria-pressed="true"]::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:2px}
#act .badge{position:absolute;right:3px;top:4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:600 10px/15px var(--sans);text-align:center}
#act .badge.warn{background:var(--warn)}
#act .grow{flex:1}

#side{grid-row:2;min-width:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.view{display:flex;flex-direction:column;min-height:0;flex:1}
.vhead{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none}
.vhead .sp{flex:1}
.vhead button{font:12px var(--sans);text-transform:none;letter-spacing:0;color:var(--muted);padding:2px 6px;border-radius:4px}
.vhead button:hover{background:var(--sunken);color:var(--ink)}
.vbody{overflow:auto;flex:1;min-height:0;padding-bottom:12px}
.group{padding:10px 12px 4px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.group .n{font-weight:400;letter-spacing:0}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:4px 12px;text-align:left;min-height:26px}
.row:hover{background:var(--sunken)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font:11px var(--mono);color:var(--muted);flex:none}
.tree .row{font-family:var(--mono);font-size:12px;gap:4px;min-height:22px;padding-top:2px;padding-bottom:2px}
.tw{width:10px;flex:none;color:var(--muted);font-size:9px}
.tree .tw.codicon{width:16px;font-size:14px}
.tree .row.sel{background:var(--accent-soft);box-shadow:inset 1px 0 0 var(--accent)}
.tree .ren{flex:1;min-width:0;font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--accent);border-radius:3px;padding:1px 4px}
.vhead .ico{padding:3px;display:grid;place-items:center}.vhead .ico .codicon{font-size:16px}
#ctx{position:fixed;z-index:20;min-width:190px;padding:4px;background:var(--raised);border:1px solid var(--line-strong);border-radius:7px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#ctx button{display:flex;justify-content:space-between;gap:16px;width:100%;padding:5px 10px;border-radius:4px;text-align:left;font-size:12.5px}
#ctx button:hover,#ctx button:focus-visible{background:var(--accent-soft);outline:none}
#ctx kbd{border:0;background:none}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#sbox{padding:0 12px 8px;flex:none}
.sfield{display:flex;align-items:center;gap:2px;border:1px solid var(--line-strong);border-radius:5px;background:var(--bg);padding:0 3px 0 0}
.sfield:focus-within{border-color:var(--accent)}
#sq{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:12.5px var(--sans);padding:6px 8px}
#sq:focus-visible{outline:none}
.tog{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--muted)}
.tog:hover{background:var(--sunken)}.tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#s-sum{margin-top:6px;font-size:11.5px}
#sres .sfile{font-size:12px;gap:4px;min-height:22px;padding-left:8px}
#sres .sfile .d{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#sres .sfile .name{flex:none;max-width:60%}
#sres .sfile .c{margin-left:auto;font:10px var(--mono);padding:1px 6px;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
#sres .smatch{padding-left:30px;min-height:22px;font:12px var(--mono)}
#sres mark{background:var(--warn-bg);color:var(--ink);box-shadow:0 0 0 1px var(--warn);border-radius:2px}
.st{width:14px;flex:none;font:600 11px var(--mono);text-align:center}
.st.M{color:var(--warn)}.st.A{color:var(--add)}.st.D{color:var(--del)}
.plus{color:var(--add)}.minus{color:var(--del)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.dot.running{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.waiting_approval{background:var(--warn)}.dot.done{background:var(--ok)}
.card{margin:6px 12px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.card .t{display:flex;gap:8px;align-items:baseline}
.card .t b{font:600 12px var(--mono);overflow-wrap:anywhere}
.card p{margin:4px 0 0;color:var(--ink-2);font-size:12px;overflow-wrap:anywhere}
.pill{font:10px/1 var(--mono);padding:3px 6px;border-radius:10px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;flex:none}
.pill.mut{color:var(--warn);border-color:var(--warn)}.pill.ro{color:var(--ok);border-color:var(--ok)}
.pill.on{color:var(--ok);border-color:var(--ok)}
.rules{margin:0 12px 6px;font:12px var(--mono);color:var(--ink-2);overflow-wrap:anywhere}
.rules div{padding:2px 0}.rules .k{display:inline-block;width:44px;color:var(--muted)}
.empty{margin:8px 12px;padding:10px;border:1px dashed var(--line-strong);border-radius:6px;color:var(--muted);font-size:12px}
.empty code{font:11px var(--mono);color:var(--ink-2)}
.primary{margin:8px 12px;height:30px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:600;flex:none}
.primary:hover{filter:brightness(1.08)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:6px 12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--line)}
.kv div{background:var(--raised);padding:7px 9px}.kv dt{font:10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.finding{margin:6px 12px;padding:8px 10px;border-left:3px solid var(--muted);background:var(--raised);border-radius:0 6px 6px 0}
.finding.warn{border-color:var(--warn)}.finding.critical{border-color:var(--bad)}
.finding b{font-size:12px}.finding p{margin:3px 0 0;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.pbody .finding{margin:0 0 8px;font-family:var(--sans)}

.split{grid-row:2;cursor:col-resize;background:transparent}
.split:hover,.split.drag{background:var(--accent)}
#split-panel{height:4px;cursor:row-resize;flex:none}

/* ------------------------------------------------------------ centre */
#center{grid-row:2;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#tabs{display:flex;height:34px;flex:none;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-right:1px solid var(--line);font:12px var(--mono);color:var(--muted);white-space:nowrap;max-width:240px;cursor:pointer}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
.tab .x{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;color:var(--muted);font-size:14px;line-height:1}
.tab .x:hover{background:var(--sunken);color:var(--ink)}
.tab .k{font-size:10px;padding:1px 4px;border-radius:3px;background:var(--hunk-bg);color:var(--accent)}
#crumbs{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;font:11px var(--mono);color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap;overflow:hidden}
#crumbs .sp{flex:1}
#crumb{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
#crumb .sep{font-size:12px;opacity:.7}#crumb .leaf{color:var(--ink)}
#crumb-pos{margin-left:12px}
#editor{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#editor .notebox{flex:1;min-height:0;overflow:auto}
#editor .mhost{flex:1;min-height:0}
/* Raised over the editor's text layer, which otherwise takes every click in a zone. */
.hunkbar{position:relative;z-index:5;display:flex;gap:6px;align-items:center;height:100%;padding-left:10px;font:11px var(--sans);color:var(--muted);pointer-events:none}
.hunkbar button{pointer-events:auto;border:1px solid var(--line-strong);border-radius:4px;padding:0 8px;height:19px;background:var(--surface);color:var(--ink);font:11px var(--sans)}
.hunkbar button.ok{color:var(--add);border-color:var(--add)}.hunkbar button.no{color:var(--del);border-color:var(--del)}
.hunkbar button:hover{filter:brightness(1.1);background:var(--sunken)}
.code{display:grid;grid-template-columns:auto minmax(0,1fr);font:12.5px/1.6 var(--mono);padding:8px 0;min-width:max-content}
.code .ln{padding:0 12px 0 16px;text-align:right;color:var(--muted);user-select:none;font-variant-numeric:tabular-nums;opacity:.7;white-space:pre}
.code .tx{padding-right:24px;white-space:pre;tab-size:4}
.tab .dot{color:var(--warn,#e0a23b);margin-left:2px}
#review{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font:12px var(--sans);color:var(--muted);flex:none}
#review>*{flex:none}
#review .what{flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#review button{white-space:nowrap;font:11px var(--sans);border:1px solid var(--line);border-radius:4px;padding:2px 9px;cursor:pointer;background:var(--surface);color:var(--ink)}
#review button.ok{color:var(--add);border-color:var(--add)}#review button.no{color:var(--del);border-color:var(--del)}
#review button.ico{padding:1px 4px;display:grid;place-items:center}
#p-terminal{padding:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
#tbar{display:flex;align-items:center;gap:4px;height:28px;flex:none;padding:0 6px;border-bottom:1px solid var(--line);background:var(--chrome)}
#ttabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.ttab{display:flex;align-items:center;gap:6px;height:22px;padding:0 4px 0 10px;border-radius:5px;font:12px var(--mono);color:var(--muted);white-space:nowrap;cursor:pointer}
.ttab:hover{background:var(--sunken)}
.ttab[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.ttab .live{color:var(--ok);font-size:9px}
.ttab .x{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;color:var(--muted);font-size:14px;line-height:1}
.ttab .x:hover{background:var(--line);color:var(--ink)}
.ttab input{font:12px var(--mono);width:110px;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:3px;padding:0 4px}
#tbar .tb{font:12px var(--sans);color:var(--muted);padding:2px 8px;border-radius:4px;flex:none}
#tbar .tb:hover{background:var(--sunken);color:var(--ink)}#tbar .tb:disabled{opacity:.4;cursor:default;background:none}
#tbar #t-kill:not(:disabled){color:var(--bad)}
#tbar .tsp{flex:1}
#tpanes{flex:1;min-height:0;position:relative}
.tpane{position:absolute;inset:0;padding:4px 0 0 8px}.tpane .xterm{height:100%}
.tempty{margin:14px 16px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tempty button{height:26px;padding:0 12px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-weight:600}
.cmd .who{color:var(--muted);font-size:11px;margin-left:6px}
.diff{font:12.5px/1.6 var(--mono);padding:8px 0;min-width:max-content}
.diff div{padding:0 16px;white-space:pre;tab-size:4}
.diff .add{background:var(--add-bg);color:var(--add)}.diff .del{background:var(--del-bg);color:var(--del)}
.diff .hunk{background:var(--hunk-bg);color:var(--accent);margin-top:6px}.diff .hdr{color:var(--muted)}
.note{margin:24px;color:var(--muted)}
#welcome{max-width:620px;margin:0 auto;padding:56px 24px;color:var(--ink-2)}
#welcome h1{font:600 22px/1.2 var(--sans);color:var(--ink);margin:0 0 6px;text-wrap:balance}
#welcome p{margin:0 0 22px;max-width:60ch}
#welcome dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:12.5px}
#welcome dt{display:flex;gap:4px;justify-content:flex-end}#welcome dd{margin:0}

#panel{flex:none;height:var(--panel);display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--surface);min-height:0}
#app.nopanel #panel,#app.nopanel #split-panel{display:none}
#ptabs{display:flex;align-items:center;gap:2px;height:30px;flex:none;padding:0 8px;border-bottom:1px solid var(--line)}
#ptabs button{padding:4px 10px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;height:30px}
#ptabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
#ptabs .sp{flex:1}#ptabs .n{font-weight:400;letter-spacing:0;margin-left:4px}
.pbody{flex:1;min-height:0;overflow:auto;font:12px/1.55 var(--mono);padding:8px 12px}
.cmd{margin:0 0 10px}.cmd .p{color:var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
.cmd .p::before{content:"$ ";color:var(--muted)}
.cmd .o{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2);max-height:260px;overflow:auto}
.cmd .o.err{color:var(--bad)}.cmd .x{color:var(--muted);font-size:11px}
.evt{display:grid;grid-template-columns:44px 150px minmax(0,1fr);gap:10px;padding:1px 0}
.evt .s{color:var(--muted);text-align:right}.evt .ty{color:var(--accent)}.evt .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.evt.untrusted .ty{color:var(--warn)}

/* ------------------------------------------------------------ agent */
#agent{grid-row:2;min-width:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
#ahead{display:flex;align-items:center;gap:8px;height:34px;flex:none;padding:0 10px 0 12px;border-bottom:1px solid var(--line)}
#ahead .ttl{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ahead button{font-size:12px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:5px;color:var(--ink-2)}
#ahead button:hover{background:var(--sunken)}
#ahead #stop{color:var(--bad);border-color:var(--bad)}
#txwrap{flex:1;min-height:0;position:relative;display:flex}
#tx{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-anchor:none}
#jump{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:4px 12px;border-radius:14px;background:var(--raised);border:1px solid var(--line-strong);color:var(--ink-2);font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#jump:hover{color:var(--ink);border-color:var(--accent)}
.msg .md{white-space:normal}
.md > :first-child{margin-top:0}.md > :last-child{margin-bottom:0}
.md p{margin:.45em 0}.md h3,.md h4,.md h5,.md h6{margin:.9em 0 .35em;font-size:13.5px;font-weight:600}
.md ul,.md ol{margin:.45em 0;padding-left:1.4em}.md li{margin:.15em 0}
.md code{font:12px var(--mono);background:var(--sunken);padding:1px 4px;border-radius:3px}
.md pre.code{font:11.5px/1.55 var(--mono);background:var(--sunken);border-left:2px solid var(--line-strong);border-radius:0 5px 5px 0;padding:.55rem .75rem;margin:.55em 0;white-space:pre;overflow-x:auto}
.md pre.code code{background:none;padding:0}
.md .tbl{overflow-x:auto;margin:.55em 0}.md table{border-collapse:collapse;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:.25em .55em;text-align:left;vertical-align:top}.md th{background:var(--sunken);font-weight:600}
.md blockquote{margin:.45em 0;padding-left:.8em;border-left:2px solid var(--line-strong);color:var(--ink-2)}
.md a{color:var(--accent)}.md hr{border:0;border-top:1px solid var(--line);margin:.7em 0}
.qbox{display:flex;flex-direction:column;gap:10px;flex:none}.qbox:empty{display:none}
.msg.user.pending{opacity:.75}
.msg.user.queued{border-style:dashed;background:var(--bg)}
.msg.user.failed{border-color:var(--bad)}
.qbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;font:11.5px var(--sans);color:var(--muted);white-space:normal}
.qbar > span{flex:1 0 100%}
.qbar button{padding:2px 8px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink-2);font-size:11.5px}
.qbar button:hover{border-color:var(--accent);color:var(--ink)}
.qbar button:disabled{opacity:.5;cursor:default}
.wait{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:none;padding:2px 2px}
.wait .dots{display:inline-flex;gap:3px}.wait .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.35}
.wait .t{font:11px var(--mono);font-variant-numeric:tabular-nums}
.think.live summary{color:var(--ink-2)}
.think pre{max-height:320px;overflow:auto}
.call .more{display:block;margin:0;padding:4px 10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--accent);width:100%;text-align:left}
@media (prefers-reduced-motion:no-preference){
  .wait .dots i{animation:blink 1.2s ease-in-out infinite}
  .wait .dots i:nth-child(2){animation-delay:.2s}.wait .dots i:nth-child(3){animation-delay:.4s}
}
@keyframes blink{40%{opacity:1}}
.msg{padding:9px 11px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{background:var(--accent-soft);border:1px solid var(--accent);align-self:flex-end;max-width:92%}
.msg.agent{background:var(--raised);border:1px solid var(--line)}
.msg .who{display:block;font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.think{font-size:12px;color:var(--muted)}
.think summary{cursor:pointer;list-style:none}.think summary::-webkit-details-marker{display:none}
.think pre{margin:6px 0 0;white-space:pre-wrap;font:12px/1.5 var(--mono);overflow-wrap:anywhere}
.call{border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;flex:none}
.call summary{display:flex;align-items:center;gap:8px;padding:6px 9px;cursor:pointer;list-style:none;font:12px var(--mono)}
.call summary::-webkit-details-marker{display:none}
.call .tool{font-weight:600;color:var(--accent)}
.call .subj{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.call .res{flex:none;font-size:11px;color:var(--muted)}
.call.err{border-color:var(--bad)}.call.err .tool{color:var(--bad)}
.call.denied{border-color:var(--bad);background:var(--bad-bg)}
.call pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;color:var(--ink-2)}
.call .why{padding:5px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.ask{border:1px solid var(--warn);background:var(--warn-bg);border-radius:6px;padding:9px 10px;flex:none}
.ask b{display:block;margin-bottom:2px}.ask p{margin:0 0 8px;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.ask .btns{display:flex;flex-wrap:wrap;gap:6px}
.ask button{padding:4px 10px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px}
.ask button.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.ask button.no{color:var(--bad);border-color:var(--bad)}
.ask .done{font:12px var(--mono);color:var(--muted)}
.todo{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;flex:none}
.todo h4{margin:0 0 5px;font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.todo div{display:flex;gap:7px;padding:1px 0}.todo .done{color:var(--muted);text-decoration:line-through}
.todo .in_progress{color:var(--accent);font-weight:600}
.sys{font:11.5px var(--mono);color:var(--muted);text-align:center;padding:2px 0;flex:none}
.sys.bad{color:var(--bad)}
#composer{flex:none;border-top:1px solid var(--line);padding:9px 10px;position:relative}
#q{width:100%;min-height:54px;max-height:200px;resize:none;border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);padding:8px 10px;display:block}
#crow{display:flex;align-items:center;gap:8px;margin-top:7px}
#crow select{font:12px var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);border-radius:5px;padding:3px 6px}
#crow .hint{flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#send{height:28px;padding:0 14px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:600}
#send:disabled{opacity:.5;cursor:default}
#slash{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:4px;background:var(--raised);border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#slash button{display:flex;gap:10px;width:100%;padding:6px 10px;text-align:left}
#slash button[aria-selected="true"]{background:var(--accent-soft)}
#slash b{font:600 12px var(--mono);min-width:88px}#slash span{color:var(--muted);font-size:12px}

/* ------------------------------------------------------------ status, palette */
#status{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--chrome);border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
#status .sp{flex:1}#status .on{color:var(--ok)}#status .off{color:var(--bad)}#status button{font:inherit;color:var(--warn)}
#status button:hover{color:var(--ink)}
#meter{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line-strong);vertical-align:1px;margin:0 6px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--ok)}#meter i.hot{background:var(--warn)}#meter i.full{background:var(--bad)}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:start center;padding-top:12vh;z-index:10}
#pal .box{width:min(560px,92vw);background:var(--raised);border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.4)}
#palq{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:14px var(--sans);padding:12px 14px}
#palq:focus-visible{outline:none}
#pall{max-height:46vh;overflow:auto;padding:4px}
#pall button{display:flex;gap:10px;align-items:baseline;width:100%;padding:7px 10px;border-radius:5px;text-align:left}
#pall button[aria-selected="true"]{background:var(--accent-soft)}
#pall .k{font:10px var(--mono);color:var(--muted);width:56px;flex:none;text-transform:uppercase}
#pall .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pall .h{font:11px var(--mono);color:var(--muted)}

@media (max-width:900px){
  #app,#app.noside{grid-template-columns:48px minmax(0,1fr)}
  #side,#center,#agent{grid-column:2;grid-row:2}
  .split{display:none}
  #app[data-pane="side"] #center,#app[data-pane="side"] #agent,
  #app[data-pane="center"] #side,#app[data-pane="center"] #agent,
  #app[data-pane="agent"] #side,#app[data-pane="agent"] #center{display:none}
  #app.noside #side{display:flex}
  #palette-open,#title .ws{display:none}
}
@media (prefers-reduced-motion:no-preference){.dot.running{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}
</style>

<body>
<div id="app" data-pane="agent">
  <header id="title">

<script>
'use strict';
const $ = id => document.getElementById(id);
// Everything drawn from the server goes in as text. File contents, tool output
// and session titles are untrusted, so no markup is ever assembled from them.
const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; };
const clear = n => { while(n.firstChild) n.removeChild(n.firstChild); };
const store = { get(k, d){ try{ const v = localStorage.getItem('abhed.ide.' + k); return v == null ? d : v; }catch{ return d; } },
                set(k, v){ try{ localStorage.setItem('abhed.ide.' + k, v); }catch{} } };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const fmt = n => (n || 0).toLocaleString('en-US');

async function api(path, opts){
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, credentials:'same-origin', ...opts});
  if(!r.ok){ let m = r.statusText; try{ m = (await r.json()).error || m; }catch{} const e = new Error(m); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}

/* ---------------------------------------------------------------- state */
let current = null, live = false, es = null, lastSeq = 0;
let caps = null, streaming = null, streamBody = null, todoNode = null, thinkBlock = null;
const calls = new Map();            // call_id -> {node, res, tool, subject, args, out}
const mineCalls = new Set();        // the person's own calls, kept out of the chat
const queued = new Map();           // queue id -> bubble waiting for the loop to read it
const sent = [];                    // bubbles shown on send, not yet matched to their user.message
const tabs = [];                    // {id, kind:'file'|'diff', path, label}
let active = null;
const known = new Set();            // file paths seen in the tree, for the palette
let sessionList = [];
const stat = { tin:0, tout:0, turns:0, ctx:0, window:0 };
let termN = 0, evtN = 0, hawkTimer = null, changesTimer = null;

/* ---------------------------------------------------------------- chrome */
function setView(name){
  document.querySelectorAll('#act button[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  document.querySelectorAll('#side .view').forEach(v => { v.hidden = v.id !== 'v-' + name; });
  $('app').classList.remove('noside'); $('app').dataset.pane = 'side';
  store.set('view', name);
  if(name === 'changes') loadChanges();
  if(name === 'hawkeye') loadHawkeye();
  if(name === 'explorer' && (!$('tree').firstChild || treeStale)) refreshTree();
  if(name === 'search') setTimeout(() => { $('sq').focus(); $('sq').select(); });
}
document.querySelectorAll('#act button[data-view]').forEach(b => b.addEventListener('click', () => {
  const same = b.getAttribute('aria-pressed') === 'true' && !$('app').classList.contains('noside');
  if(same && window.innerWidth > 900) $('app').classList.add('noside'); else setView(b.dataset.view);
}));
function setPanel(name){
  document.querySelectorAll('#ptabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.p === name)));
  ['terminal','problems','events'].forEach(p => { $('p-' + p).hidden = p !== name; });
  if(name === 'terminal') requestAnimationFrame(fitActive);
  $('app').classList.remove('nopanel');
}
document.querySelectorAll('#ptabs button').forEach(b => b.addEventListener('click', () => setPanel(b.dataset.p)));

function applyTheme(t){ if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(store.get('theme', ''));
$('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const next = dark ? 'light' : 'dark'; applyTheme(next); store.set('theme', next);
  editorTheme();
  terms.forEach(x => { x.term.options.theme = next === 'dark' ? TERM_DARK : TERM_LIGHT; });
});

function dragSplit(handle, cssVar, axis, sign, min, max){
  handle.addEventListener('pointerdown', e => {
    e.preventDefault(); handle.classList.add('drag'); handle.setPointerCapture(e.pointerId);
    const start = axis === 'x' ? e.clientX : e.clientY;
    const from = parseInt(getComputedStyle(document.documentElement).getPropertyValue(cssVar), 10);
    const move = ev => {
      const d = ((axis === 'x' ? ev.clientX : ev.clientY) - start) * sign;
      const v = Math.max(min, Math.min(max(), from + d));
      document.documentElement.style.setProperty(cssVar, v + 'px'); store.set(cssVar, v);
    };
    const up = () => { handle.classList.remove('drag'); handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
  });
  const saved = parseInt(store.get(cssVar, ''), 10);
  if(saved) document.documentElement.style.setProperty(cssVar, saved + 'px');
}
dragSplit($('split-side'), '--side', 'x', 1, 180, () => window.innerWidth * .4);
dragSplit($('split-agent'), '--agent', 'x', -1, 300, () => window.innerWidth * .55);
dragSplit($('split-panel'), '--panel', 'y', -1, 90, () => window.innerHeight * .7);

/* ---------------------------------------------------------------- tabs + editor */
// One editor for files and one diff editor for review, each tab holding its own
// model, so switching tabs keeps undo history, cursor and scroll.
const E = window.AbhedEditor, M = E.monaco;
const modKey = k => (isMac ? '⌘' : 'Ctrl ') + k;
const edPane = $('editor'), noteBox = el('div', 'notebox'), reviewBar = el('div'), codeHost = el('div', 'mhost'), diffHost = el('div', 'mhost');
reviewBar.id = 'review'; edPane.append(noteBox, reviewBar, codeHost, diffHost);
let code = null, diff = null, uriSeq = 0, diffInline = store.get('diff.inline', '') === '1';
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; }
M.editor.defineTheme('abhed-light', {base:'vs', inherit:true, rules:[], colors:{'editor.background':'#FAFAF8', 'minimap.background':'#FAFAF8', 'editorGutter.background':'#FAFAF8'}});
M.editor.defineTheme('abhed-dark', {base:'vs-dark', inherit:true, rules:[], colors:{'editor.background':'#0B0B0C', 'minimap.background':'#0B0B0C', 'editorGutter.background':'#0B0B0C'}});
const editorTheme = () => M.editor.setTheme(isDark() ? 'abhed-dark' : 'abhed-light');
editorTheme(); matchMedia('(prefers-color-scheme:dark)').addEventListener('change', editorTheme);
const editorOptions = {
  automaticLayout:true, fontFamily:'"JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace', fontSize:13, lineHeight:20,
  minimap:{enabled:store.get('minimap', '1') === '1'}, folding:true, showFoldingControls:'mouseover', matchBrackets:'always', bracketPairColorization:{enabled:true},
  guides:{bracketPairs:'active', indentation:true}, stickyScroll:{enabled:true}, renderWhitespace:'selection', scrollBeyondLastLine:false,
  smoothScrolling:true, cursorSmoothCaretAnimation:'on', multiCursorModifier:'alt', fixedOverflowWidgets:true, 'semanticHighlighting.enabled':true,
};
function toggleMinimap(){ const on = store.get('minimap', '1') !== '1'; store.set('minimap', on ? '1' : '0'); if(code) code.updateOptions({minimap:{enabled:on}}); }
function pane(which){ noteBox.hidden = which !== 'note'; codeHost.hidden = which !== 'code'; diffHost.hidden = reviewBar.hidden = which !== 'diff'; }
function note(text){ clear(noteBox); noteBox.appendChild(el('p', 'note', text)); pane('note'); }
function wire(ed){
  ed.addAction({id:'abhed.ask', label:'Ask the agent about the selection', keybindings:[M.KeyMod.CtrlCmd | M.KeyCode.KeyL],
    contextMenuGroupId:'navigation', contextMenuOrder:0, run: () => focusAgent()});
  ed.onDidChangeCursorSelection(() => drawPos(ed));
  ed.onDidFocusEditorText(() => drawPos(ed));
}
function codeEditor(){ if(!code){ code = M.editor.create(codeHost, {...editorOptions, model:null}); wire(code); } return code; }
function diffEditor(){
  if(!diff){
    diff = M.editor.createDiffEditor(diffHost, {...editorOptions, renderSideBySide:!diffInline, useInlineViewWhenSpaceIsLimited:false,
      originalEditable:false, ignoreTrimWhitespace:false, renderMarginRevertIcon:false, renderIndicators:true, minimap:{enabled:false}});
    diff.onDidUpdateDiff(drawHunks); wire(diff.getModifiedEditor());
  }
  return diff;
}
const activeTab = () => tabs.find(x => x.id === active);
function activeEditor(){ const t = activeTab(); if(!t || !t.model) return null; return t.kind === 'diff' ? (diff && diff.getModifiedEditor()) : code; }
const editorFocused = () => !!((code && code.hasTextFocus()) || (diff && diff.getModifiedEditor().hasTextFocus()));
function drawPos(ed){
  const s = ed.getSelection(); if(!s || ed !== activeEditor()){ return; }
  const n = ed.getModel() ? ed.getModel().getValueLengthInRange(s) : 0;
  $('crumb-pos').textContent = 'Ln ' + s.positionLineNumber + ', Col ' + s.positionColumn + (n ? ' (' + n + ' selected)' : '');
}
// The language comes from the file name; a rename can change it.
function languageOf(path){
  const name = path.split('/').pop().toLowerCase(), dot = name.lastIndexOf('.'), ext = dot >= 0 ? name.slice(dot) : '';
  const hit = M.languages.getLanguages().find(l => (l.filenames || []).some(f => f.toLowerCase() === name) || (ext && (l.extensions || []).includes(ext)));
  return hit ? hit.id : 'plaintext';
}
function makeModel(t, text){
  // A counter keeps each tab's model distinct, even for two tabs on one path.
  t.model = M.editor.createModel(text, languageOf(t.path), M.Uri.from({scheme:'file', path:'/' + t.path, query:String(++uriSeq)}));
  t.saved = t.model.getAlternativeVersionId();
  t.model.onDidChangeContent(() => {
    if(t.quiet) return;
    const dirty = t.model.getAlternativeVersionId() !== t.saved; t.armed = false;
    if(dirty !== !!t.dirty){ t.dirty = dirty; drawTabs(); }
    if(dirty) crumbs(t.path, 'unsaved · ' + modKey('S') + ' to save');
  });
  t.lsp = E.attachLanguageServer(t.model, codeEditor());
}
// setText replaces a clean model's text with what is on disk, without marking it edited.
function setText(t, text){ if(t.model.getValue() === text) return; t.quiet = true; t.model.setValue(text); t.quiet = false; t.saved = t.model.getAlternativeVersionId(); }
function dropTab(t){
  if(code && t.model && code.getModel() === t.model) code.setModel(null);
  if(diff && t.model && diff.getModel() && diff.getModel().modified === t.model) diff.setModel(null);
  [t.lsp, t.model, t.orig].forEach(d => { if(d) d.dispose(); }); t.model = t.orig = t.lsp = null;
}
function newTab(kind, path){ return {id:(kind === 'diff' ? 'd:' : 'f:') + path, kind, path, label:path.split('/').pop()}; }

function openTab(t, at){
  let have = tabs.find(x => x.id === t.id);
  if(!have){ const i = tabs.findIndex(x => x.id === active); tabs.splice(i < 0 ? tabs.length : i + 1, 0, t); have = t; }
  if(at) have.reveal = at;
  keepView(); active = have.id; drawTabs(); showTab(have);
  if(window.innerWidth <= 900) $('app').dataset.pane = 'center';
}
// keepView remembers the cursor and scroll of the tab being left.
function keepView(){ const t = activeTab(); if(t && t.kind === 'file' && code && code.getModel() === t.model) t.viewState = code.saveViewState(); }
function closeTab(id){
  const i = tabs.findIndex(x => x.id === id); if(i < 0) return;
  const gone = tabs.splice(i, 1)[0]; dropTab(gone);
  if(active === id){ const n = tabs[i] || tabs[i-1]; active = n ? n.id : null; if(n) showTab(n); else welcome(); }
  drawTabs();
}
// Closing a tab with unsaved edits takes a second press, as the tab's own × does.
function closeActive(){
  const t = activeTab(); if(!t) return;
  if(t.dirty && !t.armed){ t.armed = true; crumbs(t.path, 'unsaved changes · ' + modKey('W') + ' again to discard them'); return; }
  closeTab(t.id);
}
function drawTabs(){
  const bar = $('tabs'); clear(bar);
  for(const t of tabs){
    const b = el('div', 'tab'); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(t.id === active)); b.tabIndex = 0;
    if(t.kind === 'diff') b.appendChild(el('span', 'k', 'diff'));
    b.appendChild(el('span', 'nm', t.label)); b.title = t.path || t.label;
    if(t.dirty) b.appendChild(el('span', 'dot', '●'));
    const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Close ' + t.label);
    x.addEventListener('click', e => { e.stopPropagation(); if(t.dirty && !x.dataset.sure){ x.dataset.sure = '1'; x.textContent = 'discard?'; return; } closeTab(t.id); });
    b.appendChild(x);
    b.addEventListener('click', () => { if(active === t.id) return; keepView(); active = t.id; drawTabs(); showTab(t); });
    b.addEventListener('auxclick', e => { if(e.button === 1 && !t.dirty) closeTab(t.id); });
    b.addEventListener('keydown', e => { if(e.key === 'Enter') b.click(); });
    bar.appendChild(b);
    if(t.id === active) requestAnimationFrame(() => b.scrollIntoView({block:'nearest', inline:'nearest'}));
  }
  persistTabs();
}
function crumbs(path, meta){
  $('crumbs').hidden = !path; const c = $('crumb'); clear(c);
  if(path) path.split('/').forEach((p, i, all) => { if(i) c.appendChild(el('span', 'sep codicon codicon-chevron-right')); c.appendChild(el('span', i === all.length - 1 ? 'leaf' : '', p)); });
  $('crumb-meta').textContent = meta || ''; if(!path) $('crumb-pos').textContent = '';
}

// Open tabs come back after a reload: which files, and which one was in front.
function persistTabs(){ if(current) store.set('tabs.' + current, JSON.stringify({open:tabs.map(t => [t.kind, t.path]), active})); }
function restoreTabs(){
  let saved = null; try{ saved = JSON.parse(store.get('tabs.' + current, 'null')); }catch{}
  if(!saved || !Array.isArray(saved.open)) return;
  for(const [kind, path] of saved.open.slice(0, 40)){
    if((kind === 'file' || kind === 'diff') && typeof path === 'string' && !tabs.some(x => x.id === newTab(kind, path).id)) tabs.push(newTab(kind, path));
  }
  const a = tabs.find(x => x.id === saved.active) || tabs[tabs.length - 1];
  if(a){ active = a.id; drawTabs(); showTab(a); }
}
window.addEventListener('beforeunload', e => { if(tabs.some(t => t.dirty)){ e.preventDefault(); e.returnValue = ''; } });

function welcome(){
  crumbs('', ''); clear(noteBox); pane('note');
  const w = el('div'); w.id = 'welcome';
  w.appendChild(el('h1', '', 'The agent works on the right. You work here.'));
  w.appendChild(el('p', '', 'Open a file to edit it, work in a shell in the Terminal below, or let the agent make a change and review it under Changes. Your saves pass the same policy as the agent\'s edits, your shell runs in the same sandbox as its commands, and both land in the same record.'));
  const dl = el('dl'), mod = isMac ? '⌘' : 'Ctrl', shift = isMac ? '⇧' : 'Shift';
  [[[mod,'P'],'Go to file; the palette also runs commands'],[[shift,mod,'F'],'Search the workspace'],[[mod,'S'],'Save, and ' + (isMac ? '⌥⌘S' : 'Ctrl+Alt+S') + ' saves all'],
   [['Ctrl','G'],'Go to line'],[[mod,'B'],'Toggle the side panel'],[['Ctrl','`'],'Toggle the terminal'],
   [[mod,'L'],'Quote the selection to the agent'],[['/'],'In the composer: slash commands']].forEach(([keys, what]) => {
    const dt = el('dt'); keys.forEach(k => dt.appendChild(el('kbd', '', k))); dl.appendChild(dt); dl.appendChild(el('dd', '', what));
  });
  w.appendChild(dl); noteBox.appendChild(w);
}
async function showTab(t){
  if(t.model) mount(t);
  else{ crumbs(t.path, 'loading…'); pane('note'); clear(noteBox); }
  try{
    if(t.kind === 'file'){
      const f = await api('/v1/sessions/' + current + '/file?path=' + encodeURIComponent(t.path));
      if(active !== t.id || !tabs.includes(t)) return;
      if(f.binary){ crumbs(t.path, fmt(f.size) + ' B · binary'); note('Binary file — not shown.'); return; }
      let meta = fmt(f.size) + ' B';
      t.readonly = f.truncated || !f.hash;
      if(!t.model){ t.base = f.hash; makeModel(t, f.content); }
      else if(!t.dirty && t.base !== f.hash){ t.base = f.hash; setText(t, f.content); }
      else if(t.dirty && t.base !== f.hash) meta = 'changed on disk since you opened it · your edits are unsaved';
      else if(t.dirty) meta = 'unsaved · ' + modKey('S') + ' to save';
      if(t.readonly) meta = fmt(f.size) + ' B · too large to edit here; shown in part';
      crumbs(t.path, meta); mount(t);
    }else{
      const [orig, cur] = await Promise.all([
        api('/v1/sessions/' + current + '/original?path=' + encodeURIComponent(t.path)),
        api('/v1/sessions/' + current + '/file?path=' + encodeURIComponent(t.path)).catch(() => null)]);
      if(active !== t.id || !tabs.includes(t)) return;
      if(orig.binary || (cur && cur.binary)){ crumbs(t.path, 'binary'); note('Binary file — no diff.'); return; }
      if(cur && cur.truncated){ crumbs(t.path, 'too large'); note('Too large to review here.'); return; }
      t.existed = orig.existed; t.deleted = !cur;
      if(!t.model){ t.base = cur ? cur.hash : ''; makeModel(t, cur ? cur.content : ''); }
      else if(!t.dirty && t.base !== (cur ? cur.hash : '')){ t.base = cur ? cur.hash : ''; setText(t, cur ? cur.content : ''); }
      if(!t.orig) t.orig = M.editor.createModel(orig.content, languageOf(t.path), M.Uri.from({scheme:'base', path:'/' + t.path, query:String(++uriSeq)}));
      else if(t.orig.getValue() !== orig.content) t.orig.setValue(orig.content);
      crumbs(t.path, (t.deleted ? 'deleted' : !orig.existed ? 'added' : 'modified') + ' · review'); mount(t);
    }
  }catch(e){ if(active === t.id){ crumbs(t.path, ''); if(!t.model) note(e.message); } }
}
function mount(t){
  if(t.kind === 'file'){
    const c = codeEditor(); pane('code');
    if(c.getModel() !== t.model){ c.setModel(t.model); if(t.viewState) c.restoreViewState(t.viewState); }
    c.updateOptions({readOnly:!!t.readonly, readOnlyMessage:{value:'This file is too large to edit here; it is shown in part.'}});
    if(t.reveal){ const r = t.reveal; t.reveal = null; const range = new M.Range(r.line, r.col || 1, r.line, r.end || r.col || 1);
      c.setSelection(range); c.revealRangeInCenterIfOutsideViewport(range); c.focus(); }
    drawPos(c); return;
  }
  if(!t.orig) return;
  drawReview(t); pane('diff');
  const d = diffEditor(), m = d.getModel();
  if(!m || m.modified !== t.model || m.original !== t.orig) d.setModel({original:t.orig, modified:t.model});
  d.getModifiedEditor().updateOptions({readOnly:!!t.deleted}); drawPos(d.getModifiedEditor());
}

// Review: the file as it is now, against what it held before the session
// changed it. Rejecting a change edits the file, so it is saved like any other
// edit and recorded as yours; accepting one moves the baseline and is recorded too.
function drawReview(t){
  clear(reviewBar);
  const what = el('span', 'what', 'Accept keeps a change · Reject restores the earlier text and saves'); what.title = 'Accept moves the baseline; Reject edits the file and saves it. Both are recorded as yours.';
  reviewBar.appendChild(what);
  const btn = (label, cls, fn, title) => { const b = el('button', cls, label); b.type = 'button'; if(title) b.title = title; b.addEventListener('click', fn); reviewBar.appendChild(b); return b; };
  const count = el('span', '', reviewCount); count.id = 'review-n'; reviewBar.appendChild(count);
  const icon = (name, title, fn) => { const b = btn('', 'ico', fn, title); b.setAttribute('aria-label', title); b.appendChild(el('span', 'codicon codicon-' + name)); };
  icon('arrow-up', 'Previous change', () => diff && diff.goToDiff('previous'));
  icon('arrow-down', 'Next change', () => diff && diff.goToDiff('next'));
  btn(diffInline ? 'Side by side' : 'Inline', '', toggleDiffLayout, 'Show the review inline or side by side');
  btn('Accept all', 'ok', async () => { if(await savedFirst(t)) acceptText(t, t.model.getValue()); });
  btn('Reject all', 'no', () => rejectAll(t));
}
function toggleDiffLayout(){
  diffInline = !diffInline; store.set('diff.inline', diffInline ? '1' : '');
  if(diff) diff.updateOptions({renderSideBySide:!diffInline});
  const t = activeTab(); if(t && t.kind === 'diff') drawReview(t);
}
// Each change carries its own Accept and Reject, in a zone above it.
let hunkZones = [], reviewCount = '';
function drawHunks(){
  const t = activeTab(); if(!diff) return;
  const ed = diff.getModifiedEditor(), m = diff.getModel();
  const changes = t && t.kind === 'diff' && m && m.modified === t.model ? diff.getLineChanges() || [] : [];
  ed.changeViewZones(acc => {
    hunkZones.forEach(id => acc.removeZone(id)); hunkZones = [];
    changes.forEach((c, i) => {
      const bar = el('div', 'hunkbar'); bar.appendChild(el('span', '', 'change ' + (i + 1) + ' of ' + changes.length));
      const b = (label, cls, fn) => { const x = el('button', cls, label); x.type = 'button';
        x.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); fn(); }); bar.appendChild(x); };
      b('Accept', 'ok', () => acceptHunk(t, c)); b('Reject', 'no', () => rejectHunk(t, c));
      const after = c.modifiedEndLineNumber === 0 ? c.modifiedStartLineNumber : c.modifiedStartLineNumber - 1;
      hunkZones.push(acc.addZone({afterLineNumber:after, heightInPx:26, domNode:bar, ordinal:0}));
    });
  });
  reviewCount = changes.length ? changes.length + (changes.length === 1 ? ' change' : ' changes') : 'no changes left';
  const n = $('review-n'); if(n) n.textContent = reviewCount;
}
// Lines s..e of a model, or none when e is 0 (the other side of an insertion or deletion).
const linesOf = (model, s, e) => e === 0 ? [] : model.getLinesContent().slice(s - 1, e);
function spliceLines(lines, s, e, put){ if(e === 0) lines.splice(s, 0, ...put); else lines.splice(s - 1, e - s + 1, ...put); return lines; }
// The baseline only ever moves to text that is on disk, so unsaved edits are saved first.
async function savedFirst(t){ if(t.dirty) await save(t); return !t.dirty; }
async function acceptHunk(t, c){
  if(!await savedFirst(t)) return;
  const text = spliceLines(t.orig.getLinesContent(), c.originalStartLineNumber, c.originalEndLineNumber,
    linesOf(t.model, c.modifiedStartLineNumber, c.modifiedEndLineNumber)).join(t.orig.getEOL());
  acceptText(t, text);
}
function rejectHunk(t, c){
  const text = spliceLines(t.model.getLinesContent(), c.modifiedStartLineNumber, c.modifiedEndLineNumber,
    linesOf(t.orig, c.originalStartLineNumber, c.originalEndLineNumber)).join(t.model.getEOL());
  replaceAll(t, text); save(t);
}
// replaceAll is an edit, not a reload: it can be undone and it marks the tab unsaved.
function replaceAll(t, text){ t.model.pushEditOperations([], [{range:t.model.getFullModelRange(), text}], () => null); }
async function acceptText(t, text){
  try{ await api('/v1/sessions/' + current + '/accept', {method:'POST', body: JSON.stringify({path:t.path, content:text})});
    if(t.orig) t.orig.setValue(text); crumbs(t.path, 'accepted · baseline moved'); changesSoon(300); }
  catch(e){ crumbs(t.path, 'not accepted — ' + e.message); }
}
async function rejectAll(t){
  if(!t.existed){
    // The file was created by this session: rejecting it all is removing it.
    try{ await api('/v1/sessions/' + current + '/delete', {method:'POST', body: JSON.stringify({path:t.path})}); closeTab(t.id); changesSoon(300); refreshDir(parentOf(t.path)); }
    catch(e){ crumbs(t.path, 'not removed — ' + e.message); }
    return;
  }
  replaceAll(t, t.orig.getValue()); await save(t);
}
async function save(t){
  if(!t || !t.model || !t.dirty || t.saving || t.readonly) return;
  t.saving = true; crumbs(t.path, 'saving…');
  const version = t.model.getAlternativeVersionId();
  try{
    const r = await api('/v1/sessions/' + current + '/file', {method:'PUT', body: JSON.stringify({path:t.path, content:t.model.getValue(), base:t.base})});
    t.base = r.hash; t.saved = version; t.dirty = t.model.getAlternativeVersionId() !== version; drawTabs();
    crumbs(t.path, 'saved · recorded as your change'); changesSoon(300); hawkSoon();
  }catch(e){ crumbs(t.path, 'not saved — ' + e.message); }
  t.saving = false;
}
const saveActive = () => save(activeTab());
async function saveAll(){ for(const t of tabs.filter(x => x.dirty)) await save(t); }
const openFile = (path, at) => openTab(newTab('file', path), at);
const openDiff = path => openTab(newTab('diff', path));

/* ---------------------------------------------------------------- explorer + changes */
// Every folder listed is remembered with where it is drawn, and every open one
// is opened again when its parent is redrawn, so a refresh keeps the tree's shape.
const dirs = new Map(), expanded = new Set();
let treeSel = null;
const parentOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const joinPath = (dir, name) => dir ? dir + '/' + name : name;
async function loadTree(path, into, depth){
  if(!current){ clear(into); into.appendChild(el('div', 'empty', 'Start or open a session to browse its workspace.')); return; }
  dirs.set(path, {into, depth});
  let res; try{ res = await api('/v1/sessions/' + current + '/tree?path=' + encodeURIComponent(path)); }
  catch(e){ clear(into); into.appendChild(el('div', 'empty', e.message)); return; }
  clear(into);
  for(const e of res.entries){
    const row = el('button', 'row'); row.type = 'button'; row.style.paddingLeft = (8 + depth * 14) + 'px'; row.dataset.path = e.path;
    if(treeSel && treeSel.path === e.path) row.classList.add('sel');
    row.appendChild(el('span', 'tw codicon' + (e.dir ? ' codicon-chevron-right' : ''))); row.appendChild(el('span', 'name', e.name));
    row.addEventListener('contextmenu', ev => { ev.preventDefault(); selectRow(row, e); treeMenu(ev.clientX, ev.clientY, e); });
    row.addEventListener('keydown', ev => {
      if(ev.key === 'F2'){ ev.preventDefault(); renameEntry(e, row); }
      else if(ev.key === 'Delete' || (isMac && ev.metaKey && ev.key === 'Backspace')){ ev.preventDefault(); deleteEntry(e); }
    });
    into.appendChild(row);
    if(e.dir){
      const kids = el('div'); kids.hidden = true; into.appendChild(kids);
      const show = open => { kids.hidden = !open; row.firstChild.className = 'tw codicon codicon-chevron-' + (open ? 'down' : 'right');
        if(open){ expanded.add(e.path); loadTree(e.path, kids, depth + 1); } else expanded.delete(e.path); };
      row.addEventListener('click', () => { selectRow(row, e); show(kids.hidden); });
      if(expanded.has(e.path)) show(true);
    }else{ known.add(e.path); row.addEventListener('click', () => { selectRow(row, e); openFile(e.path); }); }
  }
  if(res.truncated) into.appendChild(el('div', 'empty', 'This folder has more entries than are listed.'));
  if(!res.entries.length && !depth) into.appendChild(el('div', 'empty', 'Empty.'));
}
function selectRow(row, e){ document.querySelectorAll('#tree .row.sel').forEach(r => r.classList.remove('sel')); row.classList.add('sel'); treeSel = e; }
function refreshDir(path){ const d = dirs.get(path); if(d && d.into.isConnected) return loadTree(path, d.into, d.depth); return loadTree('', $('tree'), 0); }
$('tree-reload').addEventListener('click', () => loadTree('', $('tree'), 0));
// After a command, once its output has been quiet for a second and at most
// four seconds after the first request; the tree keeps its open folders.
let treeStale = false, treeTimer = null, treeFirst = 0;
function refreshTree(){
  if($('v-explorer').hidden){ treeStale = true; return; }
  treeStale = false;
  const box = $('tree'), top = box.scrollTop;
  Promise.resolve(loadTree('', box, 0)).then(() => { box.scrollTop = top; });
}
function treeSoon(){
  const now = Date.now(); if(!treeTimer) treeFirst = now;
  clearTimeout(treeTimer);
  treeTimer = setTimeout(() => { treeTimer = null; terms.forEach(x => { x.watch = false; }); refreshTree(); }, Math.max(0, Math.min(1000, 4000 - (now - treeFirst))));
}
$('tree-collapse').addEventListener('click', () => { expanded.clear(); loadTree('', $('tree'), 0); });
$('tree-newfile').addEventListener('click', () => newEntry(false));
$('tree-newfolder').addEventListener('click', () => newEntry(true));
$('tree').addEventListener('contextmenu', ev => { if(ev.target === $('tree')){ ev.preventDefault(); treeSel = null; treeMenu(ev.clientX, ev.clientY, null); } });

// nameInput puts an editable name into the tree and calls done with what was typed.
function nameInput(anchor, before, depth, initial, done, onEnd){
  const row = el('div', 'row'); row.style.paddingLeft = (8 + depth * 14) + 'px';
  const input = el('input', 'ren'); input.value = initial; input.spellcheck = false; input.setAttribute('aria-label', 'Name');
  row.appendChild(el('span', 'tw codicon')); row.appendChild(input);
  if(before) anchor.insertBefore(row, before); else anchor.appendChild(row);
  let over = false;

function bubble(cls, who, text){ const m = el('div', 'msg ' + cls); m.appendChild(el('span', 'who', who)); m.appendChild(document.createTextNode(text || '')); return m; }

// Deltas are gathered and drawn once a frame, appended to one text node: a

const flushSoon = () => { if(!flushRaf) flushRaf = requestAnimationFrame(() => { flushRaf = 0; flushStream(); }); };

// Reasoning streamed live into an open block, closed once the reply starts.
function thinkLive(at){
  if(thinkBlock && thinkBlock.live) return thinkBlock;
  const d = el('details', 'think live'); d.open = true;
  const s = el('summary', '', '▾ thinking'), pre = el('pre'), body = document.createTextNode('');
  pre.appendChild(body); d.append(s, pre); add(d);

/* ---------------------------------------------------------------- markdown */
// Replies are markdown. They are built as nodes, never as markup, so a reply
// quoting a hostile file can only ever put text on the page.
function mdInline(parent, s){
  const re = /(`+)([^`]+?)\1|\*\*(.+?)\*\*|__(.+?)__|\*([^*\s][^*\n]*?)\*|\[([^\]]+)\]\(([^)\s]+)\)/g;
  let at = 0, m;
  while((m = re.exec(s))){
    if(m.index > at) parent.appendChild(document.createTextNode(s.slice(at, m.index)));
    if(m[2] != null) parent.appendChild(el('code', '', m[2]));
    else if(m[3] != null || m[4] != null) mdInline(parent.appendChild(el('strong')), m[3] != null ? m[3] : m[4]);
    else if(m[5] != null) mdInline(parent.appendChild(el('em')), m[5]);
    else if(/^(https?:\/\/|mailto:)/i.test(m[7])){ const a = el('a'); a.href = m[7]; a.target = '_blank'; a.rel = 'noopener noreferrer'; mdInline(a, m[6]); parent.appendChild(a); }
    else parent.appendChild(document.createTextNode(m[0]));
    at = re.lastIndex;
  }
  if(at < s.length) parent.appendChild(document.createTextNode(s.slice(at)));
}
function md(text){
  const root = el('div', 'md'), lines = String(text || '').split('\n');
  let list = null, kind = '', para = null, quote = null;
  const flat = () => { list = null; kind = ''; para = null; quote = null; };
  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    const fence = /^\s*(`{3,}|~{3,})\s*([\w+#.-]*)\s*$/.exec(line);
    if(fence){
      const body = [];
      for(i++; i < lines.length && !lines[i].trim().startsWith(fence[1]); i++) body.push(lines[i]);
      const pre = el('pre', 'code'); pre.appendChild(el('code', '', body.join('\n'))); if(fence[2]) pre.dataset.lang = fence[2];
      root.appendChild(pre); flat(); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line)){
      const rows = [];
      for(; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) if(!/^[\s|:-]+$/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|'));
      i--;
      const wrap = el('div', 'tbl'), table = el('table');
      rows.forEach((cells, r) => { const tr = el('tr'); cells.forEach(c => mdInline(tr.appendChild(el(r ? 'td' : 'th')), c.trim())); table.appendChild(tr); });
      wrap.appendChild(table); root.appendChild(wrap); flat(); continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if(h){ mdInline(root.appendChild(el('h' + Math.min(h[1].length + 2, 6))), h[2]); flat(); continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ root.appendChild(el('hr')); flat(); continue; }
    const item = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(line);
    if(item){
      const k = /\d/.test(item[1]) ? 'ol' : 'ul';
      if(kind !== k){ flat(); list = root.appendChild(el(k)); kind = k; }
      mdInline(list.appendChild(el('li')), item[2]); continue;
    }
    const q = /^\s*>\s?(.*)$/.exec(line);
    if(q){ if(!quote){ flat(); quote = root.appendChild(el('blockquote')); } else quote.appendChild(el('br')); mdInline(quote, q[1]); continue; }
    if(!line.trim()){ flat(); continue; }
    if(!para){ flat(); para = root.appendChild(el('p')); } else para.appendChild(el('br'));
    mdInline(para, line);
  }
  return root;
}

/* ---------------------------------------------------------------- queue */
// A message sent while the agent works waits for the next step, and can be
// sent now instead, or withdrawn, until the loop reads it.
// Every message carries an id of the page's own, echoed on the user.message
// that records it, so matching never depends on the recorded text.
const newCid = () => 'c-' + Array.from(crypto.getRandomValues(new Uint8Array(9)), x => x.toString(16).padStart(2, '0')).join('');
function userBubble(text, state){ const b = bubble('user' + (state ? ' ' + state : ''), 'you', text); b.text = text; b.cid = newCid(); return b; }
function drawQueued(b){

  const bar = el('div', 'qbar');
  if(b.classList.contains('queued')){
    bar.appendChild(el('span', '', b.qnote || (b.qid ? 'Queued — will be read at the next step' : 'Queueing…')));
    const now = el('button', '', 'Send now'), cancel = el('button', '', 'Cancel'); now.type = cancel.type = 'button';
    now.disabled = cancel.disabled = !b.qid || !!b.busy;
    now.addEventListener('click', () => sendNow(b)); cancel.addEventListener('click', () => unqueue(b));
    bar.append(now, cancel);
  }else if(b.qnote) bar.appendChild(el('span', '', b.qnote));
  else if(b.classList.contains('pending')) bar.appendChild(el('span', '', 'Sending…'));
  else return;
  b.appendChild(bar);
}
function forget(b){ const i = sent.indexOf(b); if(i >= 0) sent.splice(i, 1); if(b.qid) queued.delete(b.qid); }
// A user.message is matched to the bubble shown when it was sent: by the

function claim(p){

  if(!b && p.queue_id) b = queued.get(p.queue_id);
  if(!b && !p.client_id && !p.queue_id) b = sent.find(x => !x.classList.contains('failed') && (x.prompt || x.text) === p.text);

  forget(b); b.delivered = true; b.qnote = '';

}
function failed(b, msg){

}
async function unqueue(b){
  if(!b.qid || !current) return false;
  b.busy = true; drawQueued(b);
  try{ await api('/v1/sessions/' + current + '/queue/' + encodeURIComponent(b.qid), {method:'DELETE'}); }
  catch(e){ b.busy = false; if(!b.delivered){ b.qnote = 'Not withdrawn — ' + e.message; drawQueued(b); } return false; }

// Send now: withdraw it from the queue, stop the running step, and send it
// as a fresh turn. The server waits for the step to stop before starting it.
async function sendNow(b){

  sent.push(b); add(b); drawQueued(b); waiting('Stopping the current step');

    await api('/v1/sessions/' + id + '/messages', {method:'POST', body: JSON.stringify({prompt: b.prompt || b.text, interrupt: true, client_id: b.cid})});

function render(ev){

  case 'agent.delta': if(thinkBlock && thinkBlock.live) endThinking(at); waiting(false); pendText += p.text || ''; flushSoon(); break;
  case 'agent.message': { waiting(false); const text = p.text || '', stick = nearBottom();
    if(streaming){ streamBody.replaceWith(md(text)); streaming = null; streamBody = null; }

    { const d = el('details', 'think'); d.appendChild(el('summary', '', '▸ reasoning · ' + words(p.text) + ' words')); d.appendChild(el('pre', '', p.text || '')); add(d); }
    break;
  case 'action.requested': {

    endThinking(at); streaming = null; streamBody = null;
    const d = el('details', 'call'), s = el('summary'); const subj = subjectOf(p.tool, p.args);
    s.appendChild(el('span', 'tool', p.tool)); s.appendChild(el('span', 'subj', subj)); const res = el('span', 'res', '…'); s.appendChild(res);
    d.appendChild(s);
    const c = {node:d, res, tool:p.tool, subject:subj, args:p.args, out:null, drawn:0};
    // Arguments and output are drawn when the call is opened, so a session of

    d.addEventListener('toggle', () => { if(d.open) fillCall(c); });
    add(d); calls.set(p.call_id, c);
    if(p.tool === 'todo' && p.args && Array.isArray(p.args.items)) drawPlan(p.args.items);
    if(p.requires_approval && live){ waiting(false); askApproval(p); }
    break; }
  case 'action.approved': { if(mineCalls.has(p.call_id)) break; const c = calls.get(p.call_id);
    if(c){ c.node.appendChild(el('div', 'why', 'allowed · step ' + (p.step || '?') + (p.by === 'reviewer' ? ' · by you' : '') + (p.reason ? ' — ' + p.reason : ''))); c.res.textContent = 'running…'; }
    settleAsk(p.call_id, 'approved'); if(live) waiting('Running ' + (c ? c.tool : 'tool')); break; }
  case 'action.denied': { if(mineCalls.has(p.call_id)){ hawkSoon(); break; } const c = calls.get(p.call_id);
    if(c){ c.node.classList.add('denied'); c.res.textContent = 'denied'; c.node.appendChild(el('div', 'why', 'denied · step ' + (p.step || '?') + ' — ' + (p.reason || ''))); }
    settleAsk(p.call_id, 'denied'); hawkSoon(); break; }
  case 'observation': {

    if(p.tool === 'write' || p.tool === 'edit') changesSoon();

    if(p.error) add(el('div', 'sys bad', 'model error: ' + p.error)); break;

  case 'subagent.returned': add(el('div', 'sys', 'subagent finished: ' + (p.reason || ''))); break;
  case 'session.ended': { endThinking(at); streaming = streamBody = null; setLive(false); const bad = !['completed','user_interrupt'].includes(p.reason);
    add(el('div', 'sys' + (bad ? ' bad' : ''), 'ended · ' + p.reason + ' · ' + (p.turns || 0) + ' turns'));

}
// A run can end just as a queued message arrives, and the server then starts
// another for it after this stream closed; or Send now's fresh turn starts
// after the interrupted one ended. Once the end has settled, ask the server.
async function recheck(id){
  let list, left;
  try{ [list, left] = await Promise.all([api('/v1/sessions'), queued.size ? api('/v1/sessions/' + id + '/queue').catch(() => []) : []]); }catch{ return; }
  if(current !== id) return;
  const s = list.find(x => x.id === id), running = !!s && (s.state === 'running' || s.state === 'waiting_approval');
  const still = new Set((left || []).map(q => q.id));
  // A bubble the server no longer holds was read by a run this page has not seen yet.
  const read = [...queued.values()].some(b => b.qid && !still.has(b.qid));
  setLive(running);
  if(running || read){ if(!es) connect(id); if(running) return; }
  for(const b of queued.values()) if(still.has(b.qid)){ b.qnote = 'Still queued — read with your next message'; drawQueued(b); }
}
function fillCall(c){
  if(!c.drawn){ c.drawn = 1; c.node.insertBefore(el('pre', '', JSON.stringify(c.args, null, 2)), c.node.firstChild.nextSibling); }
  if(c.out != null && c.drawn < 2){ c.drawn = 2; c.node.appendChild(clip(c.out)); }
}
// Long output shows its head until asked for the rest.
function clip(text){
  const lines = text.split('\n'); if(lines.length <= 24 && text.length <= 2000) return el('pre', '', text);
  const pre = el('pre', '', lines.slice(0, 24).join('\n').slice(0, 2000) + '\n…'), more = el('button', 'more', 'show all ' + lines.length + ' lines');
  more.type = 'button'; more.addEventListener('click', () => { pre.textContent = text; more.remove(); });
  const wrap = el('div'); wrap.append(pre, more); return wrap;
}
// One plan block, moved to the end each time it changes, so the current

function drawPlan(items){
  if(!todoNode) todoNode = el('div', 'todo'); clear(todoNode); todoNode.appendChild(el('h4', '', 'Plan'));
  items.forEach(i => { const r = el('div', i.status); r.appendChild(el('span', '', i.status === 'done' ? '✓' : i.status === 'in_progress' ? '▶' : '○')); r.appendChild(el('span', '', i.text)); todoNode.appendChild(r); });

      catch(e){ a.appendChild(el('p', '', e.message)); btns.querySelectorAll('button').forEach(x => { x.disabled = false; }); } }); return b; };

/* ---------------------------------------------------------------- terminal */
// Each tab is one interactive shell in the session's sandbox or, where the
// server says a shell cannot be offered, a terminal that runs each line as a
// checked command of its own. The agent's commands have a read-only tab.
const TERM_DARK = {background:'#0B0B0C', foreground:'#E4E4DF', cursor:'#FF7A45', selectionBackground:'#4A2A1A'};
const TERM_LIGHT = {background:'#FAFAF8', foreground:'#0B0B0C', cursor:'#C2410C', selectionBackground:'#FFD9C7'};
const terms = [];
let activeTerm = null, agentTerm = null, termSeq = 0;
const ptyURL = (t, rest) => '/v1/sessions/' + t.session + '/pty' + (rest || '');
function bytesOf(b64){ const bin = atob(b64), out = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }

function makeTerm(name, kind){
  const box = $('tpanes'); box.querySelectorAll('.tempty').forEach(n => n.remove());
  const pane = el('div', 'tpane'); box.appendChild(pane);
  const term = new Terminal({fontFamily:'"SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace', fontSize:12, lineHeight:1.2, cursorBlink:kind !== 'agent',
    convertEol:kind === 'agent', scrollback:5000, theme:isDark() ? TERM_DARK : TERM_LIGHT, allowTransparency:true, disableStdin:kind === 'agent'});
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(pane);

  terms.push(t);
  term.onData(d => onTermData(t, d));

  selectTerm(t);
  return t;
}
function selectTerm(t){
  activeTerm = t; terms.forEach(x => { x.pane.hidden = x !== t; }); drawTermTabs();
  requestAnimationFrame(() => { fitActive(); if(activeTerm === t) t.term.focus(); });
}
function drawTermTabs(){
  const bar = $('ttabs'); clear(bar);
  for(const t of terms){
    const b = el('div', 'ttab'); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(t === activeTerm)); b.tabIndex = 0;
    const nm = el('span', 'nm', t.name); if(t.kind !== 'agent') nm.title = 'Double-click to rename'; b.appendChild(nm);
    if(t.run) b.appendChild(el('span', 'live', '●'));

    b.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target === b) selectTerm(t); });
    if(t.kind !== 'agent') nm.addEventListener('dblclick', e => { e.stopPropagation(); renameTerm(t, nm); });

// Open shells are remembered for this tab of the browser, so a reload
// reattaches to them rather than leaving them to run unwatched.
const shellsKey = id => 'abhed.ide.shells.' + id;
// Streams closing as the page unloads must not read as shells that ended.
let leaving = false;
addEventListener('beforeunload', () => { leaving = true; });
addEventListener('pagehide', () => { leaving = true; });
function saveShells(id){
  id = id || current;
  if(!id || leaving) return;
  const open = terms.filter(t => t.kind === 'shell' && t.mode === 'shell' && t.run && t.session === id)
    .map(t => ({id:t.run, name:t.name, info:t.info}));
  try{ sessionStorage.setItem(shellsKey(id), JSON.stringify(open)); }catch{}
}
function savedShells(id){ try{ return JSON.parse(sessionStorage.getItem(shellsKey(id)) || '[]'); }catch{ return []; } }
function renameTerm(t, nm){
  const inp = el('input'); inp.value = t.name; inp.setAttribute('aria-label', 'Terminal name'); nm.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = keep => { if(done) return; done = true; if(keep && inp.value.trim()) t.name = inp.value.trim().slice(0, 40); drawTermTabs(); t.term.focus(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Enter') finish(true); else if(e.key === 'Escape') finish(false); });

function endRun(t, kill){

}
function closeTerm(t){

    const dir = queue.shift(); requests++;
    let res; try{ res = await api('/v1/sessions/' + mine + '/tree?path=' + encodeURIComponent(dir)); }catch{ continue; }
    for(const e of res.entries){ if(e.dir) queue.push(e.path); else known.add(e.path); }
    if(!$('pal').hidden) drawPal();
  }
}
function openPal(){ $('pal').hidden = false; $('palq').value = ''; palSel = 0; drawPal(); $('palq').focus(); indexFiles(); }
function closePal(){ $('pal').hidden = true; }
$('palette-open').addEventListener('click', openPal);
$('palq').addEventListener('input', () => { palSel = 0; drawPal(); });
$('palq').addEventListener('keydown', e => {
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if(palHits.length){ palSel = (palSel + (e.key === 'ArrowDown' ? 1 : palHits.length - 1)) % palHits.length; drawPal(); } }
  else if(e.key === 'Enter'){ e.preventDefault(); const i = palHits[palSel]; if(i){ closePal(); i.run(); } }
  else if(e.key === 'Escape') closePal();
});
$('pal').addEventListener('pointerdown', e => { if(e.target === $('pal')) closePal(); });
document.addEventListener('keydown', e => {
  // Ctrl+` is the terminal on every platform, as in desktop editors.
  if(e.ctrlKey && !e.metaKey && !e.altKey && e.code === 'Backquote'){ e.preventDefault(); toggleTerminal(); return; }
  const mod = isMac ? e.metaKey : e.ctrlKey; if(!mod) return; const k = e.key.toLowerCase();
  if(e.shiftKey && e.code === 'KeyF'){ e.preventDefault(); findInFiles(); }
  else if(e.shiftKey && e.code === 'KeyE'){ e.preventDefault(); setView('explorer'); }
  else if(e.altKey && e.code === 'KeyS'){ e.preventDefault(); saveAll(); }
  else if(k === 'k' || k === 'p'){ e.preventDefault(); if($('pal').hidden) openPal(); else closePal(); }
  else if(k === 's'){ e.preventDefault(); saveActive(); }
  // A browser keeps Cmd+W for itself in a normal tab; where it reaches the page, it closes the editor tab.
  else if(k === 'w'){ e.preventDefault(); closeActive(); }
  else if(k === 'b'){ e.preventDefault(); $('app').classList.toggle('noside'); }
  else if(k === 'j'){ e.preventDefault(); $('app').classList.toggle('nopanel'); }
  else if(k === 'l'){ e.preventDefault(); focusAgent(); }
});
function toggleTerminal(){
  if($('app').classList.contains('nopanel') || $('p-terminal').hidden){ setPanel('terminal'); if(activeTerm) activeTerm.term.focus(); }
  else{ $('app').classList.add('nopanel'); const ed = activeEditor(); if(ed) ed.focus(); }
}
function editorAction(id){ const ed = activeEditor(); if(!ed) return; ed.focus(); const a = ed.getAction(id); if(a) a.run(); }
function focusAgent(){ askAboutSelection(); $('app').dataset.pane = 'agent'; $('q').focus(); }
$('palkey').textContent = isMac ? '⌘P' : 'Ctrl P';
// Select code in the editor and press the focus-agent key: the selection is
// quoted into the composer with its file and line numbers.
function askAboutSelection(){
  const t = activeTab(), ed = activeEditor(); if(!t || !ed) return;
  const sel = ed.getSelection(); if(!sel || sel.isEmpty()) return;
  const q = $('q'); q.value = 'In `' + t.path + '` lines ' + sel.startLineNumber + '–' + sel.endLineNumber + ':\n```\n' + ed.getModel().getValueInRange(sel) + '\n```\n' + q.value;
  q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 260) + 'px';
}

/* ---------------------------------------------------------------- boot */
(async () => {
  welcome();
  try{ caps = await api('/v1/capabilities'); setConn(true); }
  catch(e){ add(el('div', 'sys bad', 'Could not reach the server: ' + e.message)); return; }
  stat.window = caps.model.context_window; drawCaps();
  const sb = caps.sandbox, sbox = $('s-sandbox');
  sbox.textContent = sb.tier === 'none' ? 'NO SANDBOX' : 'sandbox ' + sb.tier + (sb.backend ? ' (' + sb.backend + ')' : '') + (sb.network ? ' · network on' : ' · no network');
  if(sb.tier === 'none') sbox.className = 'off';
  $('s-model').textContent = caps.model.name; $('mode').value = caps.permissions.mode; $('s-mode').textContent = 'mode ' + caps.permissions.mode;
  try{
    const me = await api('/v1/whoami');
    if(me.authenticated){
      $('who').textContent = me.email || me.name || me.subject || '';
      if(me.sign_out_url){ $('signout').href = me.sign_out_url; $('signout').hidden = false; }
      if(me.switch_url){ $('switchuser').href = me.switch_url; $('switchuser').hidden = false; }
      if(me.password_url){ $('pwlink').href = me.password_url; $('pwlink').hidden = false; }
      // A password an administrator set: say so where sign-in now lands.
      let mustChange = false;
      try{ mustChange = sessionStorage.getItem('abhed.must_change') === '1'; sessionStorage.removeItem('abhed.must_change'); }catch{}
      if(mustChange && me.password_url){
        $('pwlink').textContent = 'change your password'; $('pwlink').style.color = 'var(--warn, #d9a441)';
        add(el('div', 'sys bad', 'This password was set for you. Change it with "change your password", at the top right.'));
      }
    }
  }catch{}
  await loadSessions();
  setView(store.get('view', 'explorer')); $('app').dataset.pane = 'agent';
  // A terminal as soon as the page opens: the last session, reopened if need be, or a new workbench session.
  const last = sessionList[0]; if(last) openSession(last.id, last.state, {auto:true, reattach:true}); else createWorkbench();
})();
</script>
