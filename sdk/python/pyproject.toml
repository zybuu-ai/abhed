[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "abhed-sdk"
version = "1.3.0.dev0"
description = "Python client for Abhed, the secure harness for deep agents, over abhed rpc"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Zybuu" }]
keywords = ["abhed", "agents", "harness", "rpc", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
# No runtime dependencies: the client is the standard library and a child process.
dependencies = []

[project.urls]
Homepage = "https://github.com/zybuu-ai/abhed"
Documentation = "https://github.com/zybuu-ai/abhed/blob/main/docs/guide/40-sdk-typescript-python.md"
Source = "https://github.com/zybuu-ai/abhed/tree/main/sdk/python"
Issues = "https://github.com/zybuu-ai/abhed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/abhed_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/abhed_sdk", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
strict = true
files = ["src/abhed_sdk"]
