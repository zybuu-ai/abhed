name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, lint, test, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Embed the documentation
        run: python3 scripts/docsite/build.py --embed-only

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

      - name: go test
        run: go test ./... -count=1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # gosec's findings are all triaged in docs/trust/security-scans.md; the
      # gate fails only on findings that are not in that baseline, so a new
      # one blocks the build and the known set does not keep the job red.
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -fmt json -no-fail -out gosec.json ./... || true
          python3 scripts/ci/gosec-gate.py gosec.json

      # The open binary must not carry any Enterprise package, and the open
      # tree must not reach for the company's deployment.
      - name: Edition boundary
        run: |
          set -euo pipefail
          if go list -deps ./cmd/abhed | grep -q '/ee/'; then
            echo "cmd/abhed depends on an ee/ package"; exit 1
          fi
          if git grep -n -E '(^|[^a-z])deploy/' -- '*.go' '*.yml' '*.md' ':!CHANGELOG.md' | grep -v '^docs/trust/security-scans.md'; then
            echo "references to the private deployment tree"; exit 1
          fi

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t abhed:ci -f Dockerfile .
      - name: The image runs and reports its version
        run: docker run --rm --entrypoint /usr/local/bin/abhed abhed:ci -version
