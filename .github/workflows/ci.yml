name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, lint, test, vulnerabilities
    runs-on: ubuntu-latest

    # The store's tests are the only check on the append-only triggers, the
    # row-level security policies and the tenant isolation they enforce. They
    # skip without a database, so CI provides one rather than leaving the
    # whole store untested.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abhed
          POSTGRES_PASSWORD: abhed
          POSTGRES_DB: abhed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abhed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"

      # The process tier is bubblewrap on Linux. Without it the sandbox tests
      # skip, and the filesystem, egress and credential boundaries the trust
      # docs call verified would go unexercised on the platform that ships.
      - name: Install bubblewrap and vim
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap vim

      # The public build links web fonts; the copy it embeds must not.
      - name: A public docs build keeps the binary's copy offline
        run: |
          python3 scripts/docsite/build.py
          go test ./internal/docsite/ -count=1
          rm -rf web/zybuu

      - name: Embed the documentation
        run: python3 scripts/docsite/build.py --embed-only

      - name: go vet
        run: go vet ./...

      # The tests build for the other platforms too; a unix-only call in an
      # untagged test file broke `GOOS=windows go vet` unnoticed.
      - name: go vet for macOS and Windows
        run: GOOS=darwin go vet ./... && GOOS=windows go vet ./...

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

      # The store refuses to connect as a superuser, because FORCE ROW LEVEL
      # SECURITY does not apply to one: the isolation tests would pass without
      # proving anything. The suite gets its own unprivileged role.
      - name: Create the unprivileged test role
        env:
          PGPASSWORD: abhed
        run: |
          psql -h localhost -U abhed -d abhed_test \
            -c "CREATE ROLE abhed_app LOGIN PASSWORD 'abhed';" \
            -c "GRANT ALL ON SCHEMA public TO abhed_app;" \
            -c "CREATE ROLE abhed_runtime LOGIN PASSWORD 'abhed';"

      - name: go test
        env:
          ABHED_TEST_DSN: postgres://abhed_app:abhed@localhost:5432/abhed_test?sslmode=disable
          ABHED_TEST_RUNTIME_DSN: postgres://abhed_runtime:abhed@localhost:5432/abhed_test?sslmode=disable
          # The page tests need node and python3; here a missing one fails, not skips.
          ABHED_REQUIRE_PAGE_TESTS: "1"
        run: go test ./... -count=1 -coverprofile=coverage.out

      # abhed_app owns the tables; abhed_runtime is what a server should run
      # as. These tests are the evidence that the audit record cannot be
      # altered with the server's credentials, and that the control plane's
      # store passes its conformance suite as that role. They skip without
      # the second role — so a skip here fails the build rather than reading
      # as a pass.
      - name: The audit record's privilege separation was actually tested
        env:
          ABHED_TEST_DSN: postgres://abhed_app:abhed@localhost:5432/abhed_test?sslmode=disable
          ABHED_TEST_RUNTIME_DSN: postgres://abhed_runtime:abhed@localhost:5432/abhed_test?sslmode=disable
        run: |
          set -euo pipefail
          go test ./store/ -count=1 -v -run 'TestRuntimeRole|TestOpenRefusesARole|TestTruncateIsRefused|TestSandbox' > record.log 2>&1 || { cat record.log; exit 1; }
          for t in TestRuntimeRoleCannotAlterTheRecord TestRuntimeRoleCanDoItsJob TestOpenRefusesARoleThatCanAlterTheRecord TestTruncateIsRefused \
                   TestSandboxStoreConformance TestSandboxesAreTenantScoped TestSandboxAuditIsAppendOnlyForTheRuntimeRole; do
            grep -q -- "--- PASS: $t" record.log || { echo "$t did not run and pass:"; grep -- "$t" record.log || true; exit 1; }
          done
          echo "all seven ran and passed"

      # A ratchet, not a target: a PR may not lower coverage below what the
      # tree already achieves. Raising the floor is a deliberate commit.
      - name: Coverage floor
        run: python3 scripts/ci/coverage-gate.py coverage.out

      # The adversarial suite runs above as part of ./..., but name it here so
      # a failure reads as "an attack succeeded" rather than a generic test.
      - name: Adversarial suite
        run: go test ./internal/redteam/ -count=1 -v

      # Draining, sticky routing and durable approvals are all concurrent, and
      # a race there loses a turn rather than crashing. The whole tree is
      # race-clean, so this gates the lot rather than a chosen few.
      - name: Race detector
        env:
          ABHED_TEST_DSN: postgres://abhed_app:abhed@localhost:5432/abhed_test?sslmode=disable
          ABHED_TEST_RUNTIME_DSN: postgres://abhed_runtime:abhed@localhost:5432/abhed_test?sslmode=disable
        run: go test ./... -race -count=1 -timeout 30m

      # The end-to-end CLI tests are evidence only if they ran. A test may
      # skip only as pending on an item listed here, each still being built:
      # "editor", a fix to the line editor (a data race when typing while
      # output arrives). Delete an item once it lands, and its tests must
      # then pass. "netns" is this runner, which
      # cannot unshare a network namespace for the statusline; the sandbox
      # job below runs those tests and lets none skip. "fence" is the fence
      # tier's end-to-end tests, which need a delegated cgroup v2 user scope
      # this runner lacks; the fence job below runs them all but the
      # network-on test, which only the fence-network job runs.
      - name: End-to-end CLI tests actually ran
        env:
          ABHED_CLITEST_PENDING: "editor netns fence"
        run: |
          set -euo pipefail
          python3 scripts/ci/clitest-skips.py --self-test
          go test ./internal/clitest/... -count=1 -json > clitest.json || true
          python3 scripts/ci/clitest-skips.py < clitest.json

      # A skipped boundary test reads exactly like a passing one, and the trust
      # docs cite these by name. One reason is expected here: the hosted runner
      # cannot unshare a network namespace, so bubblewrap cannot start. The
      # boundaries themselves are verified in the privileged job below. A skip
      # for any other reason means a boundary stopped being checked, so the
      # build fails rather than let the count drift.
      # The fence tier's kernel tests need a delegated cgroup v2 user scope
      # this runner lacks; the fence job below runs them, and none may skip there.
      - name: Sandbox boundary tests actually ran
        run: |
          set -euo pipefail
          go test ./internal/sandbox/ -count=1 -v > sandbox.log 2>&1 || { cat sandbox.log; exit 1; }
          skipped=$(grep -c -- "--- SKIP" sandbox.log || true)
          expected=$(grep -cE "cannot unshare the network namespace|cannot create a sandbox.s namespaces here|set ABHED_REQUIRE_CONTAINER=1|set ABHED_REQUIRE_FENCE=1 in a delegated cgroup" sandbox.log || true)
          if [ "$skipped" -ne "$expected" ]; then
            echo "A sandbox test skipped for an unexpected reason ($skipped skipped, $expected accounted for):"
            grep -B3 -- "--- SKIP" sandbox.log
            exit 1
          fi
          echo "$(grep -c -- "--- PASS" sandbox.log || true) sandbox tests ran, $skipped skipped for known reasons"

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # gosec's findings are all triaged in docs/trust/security-scans.md; the
      # gate fails only on findings that are not in that baseline, so a new
      # one blocks the build and the known set does not keep the job red.
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -fmt json -no-fail -out gosec.json ./... || true
          python3 scripts/ci/gosec-gate.py gosec.json

      # The open binary must not carry any Enterprise package, and the open
      # tree must not reach for the company's deployment.
      - name: Edition boundary
        run: |
          set -euo pipefail
          if go list -deps ./cmd/abhed | grep -q '/ee/'; then
            echo "cmd/abhed depends on an ee/ package"; exit 1
          fi
          # The changelog and the scan record are history and may name the
          # old tree; this workflow names the pattern it looks for. The open
          # Helm chart, deploy/helm/, is not that tree.
          if git grep -n -E '(^|[^a-z])deploy/' -- '*.go' '*.yml' '*.md' \
               ':!CHANGELOG.md' ':!docs/trust/security-scans.md' ':!.github/workflows/ci.yml' \
               | grep -E '(^|[^a-z])deploy/($|[^h]|h($|[^e])|he($|[^l])|hel($|[^m])|helm($|[^/]))'; then
            echo "references to the private deployment tree"; exit 1
          fi

  # The process tier on Linux is bubblewrap, and denying network needs a
  # namespace the hosted runner will not grant. A privileged container can, so
  # this is where the egress, credential and state boundaries are actually
  # exercised on the backend the image ships. Nothing here may skip.
  sandbox:
    name: Linux sandbox boundaries
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.9
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and vim
        run: apt-get update && apt-get install -y --no-install-recommends bubblewrap vim
      - name: Every process-sandbox boundary runs under bubblewrap
        run: |
          set -euo pipefail
          go test ./internal/sandbox/ -run 'ProcessSandbox|ReadableFile' -count=1 -v > sandbox.log 2>&1 || { cat sandbox.log; exit 1; }
          if grep -q -- "--- SKIP" sandbox.log; then
            echo "a boundary test skipped under a privileged runner:"; grep -B3 -- "--- SKIP" sandbox.log; exit 1
          fi
          echo "$(grep -c -- "--- PASS" sandbox.log) boundary tests ran under bubblewrap"
      # The statusline's pinned script, end to end under bubblewrap: it runs,
      # and swapped for a link into ~/.abhed it neither runs nor reads.
      - name: The statusline script is pinned under bubblewrap
        run: |
          set -euo pipefail
          go test ./app/ -run 'TestStatuslineScriptPinned$' -count=1 -v > pin.log 2>&1 || { cat pin.log; exit 1; }
          grep -q -- "--- PASS: TestStatuslineScriptPinned" pin.log || { echo "the pin test did not run and pass:"; cat pin.log; exit 1; }
      # The statusline runs with no network, so on the hosted runner its tests
      # skip; here each must run and pass.
      - name: The statusline runs under bubblewrap
        run: |
          set -euo pipefail
          go test ./app/ -run 'TestRunStatusline$|TestTUIStatusLineCommand$|TestTUIStatusLineIsSanitized$' -count=1 -v > status.log 2>&1 || { cat status.log; exit 1; }
          go test ./internal/clitest/ -run 'TestStatuslineFromUserConfig$' -count=1 -v >> status.log 2>&1 || { cat status.log; exit 1; }
          for t in TestRunStatusline TestTUIStatusLineCommand TestTUIStatusLineIsSanitized TestStatuslineFromUserConfig; do
            grep -q -- "--- PASS: $t " status.log || { echo "$t did not run and pass:"; grep -- "$t" status.log || true; exit 1; }
          done
      # rpc and acp, stopped by SIGTERM, end the command they were running:
      # here it runs under bubblewrap, where the hosted runner would skip it.
      - name: rpc and acp stop their sandboxed command on SIGTERM
        run: |
          set -euo pipefail
          go test ./app/ -run 'TestRPCExitsOnSIGTERMAndEndsItsCommand$|TestACPExitsOnSIGTERMAfterTheStopReason$' -count=1 -v > stop.log 2>&1 || { cat stop.log; exit 1; }
          for t in TestRPCExitsOnSIGTERMAndEndsItsCommand TestACPExitsOnSIGTERMAfterTheStopReason; do
            grep -q -- "--- PASS: $t " stop.log || { echo "$t did not run and pass:"; grep -- "$t" stop.log || true; exit 1; }
          done
      # The kernel does not bound root's processes, and this job runs as root,
      # so the process limit is checked as an unprivileged user.
      - name: The process limit binds an unprivileged user's commands
        run: |
          set -euo pipefail
          # Ubuntu's AppArmor refuses user namespaces to unprivileged users;
          # bubblewrap needs one. Lift that for this job, however it is exposed.
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || echo 0 > "$knob" || true
          fi
          useradd -m abhedci
          # An environment that cannot give the user a sandbox is named as such,
          # not read as a boundary that stopped holding.
          if ! runuser -u abhedci -- bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true 2>probe.err; then
            echo "ENVIRONMENT: an unprivileged user cannot start bubblewrap here ($(cat probe.err));"
            [ -e "$knob" ] && echo "  $knob = $(cat "$knob")"
            exit 1
          fi
          go test -c -o /tmp/sandbox.test ./internal/sandbox/
          chmod 755 /tmp/sandbox.test
          cd /tmp
          runuser -u abhedci -- /tmp/sandbox.test -test.run 'TestProcessLimitHoldsForTheCommand|TestBoundedProcessesUnderTheSandbox' -test.count=1 -test.v > limit.log 2>&1 || { cat limit.log; exit 1; }
          for t in TestProcessLimitHoldsForTheCommand TestBoundedProcessesUnderTheSandbox; do
            grep -q -- "--- PASS: $t" limit.log || { echo "$t did not run and pass:"; cat limit.log; exit 1; }
          done

  # The fence tier's gated tests, as an ordinary user in a delegated cgroup
  # scope with ABHED_REQUIRE_FENCE=1; none may skip but the network-on test.
  fence:
    name: Fence tier on a real kernel (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      FENCE_DIR: /var/tmp/abhed-fence-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
      - name: Build the test binaries
        run: scripts/ci/fence-gated.sh build "$FENCE_DIR"
      - name: Allow user namespaces to those binaries, mount the alias, start the user manager
        run: scripts/ci/fence-gated.sh prepare "$FENCE_DIR"
      - name: The kernel offers what the fence needs
        run: scripts/ci/fence-gated.sh check "$FENCE_DIR"
      - name: Every gated fence test runs and passes in a delegated scope
        run: |
          XDG_RUNTIME_DIR=/run/user/$(id -u)
          export XDG_RUNTIME_DIR
          systemd-run --user --scope --quiet -p Delegate=yes -- scripts/ci/fence-gated.sh run "$FENCE_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fence-logs-${{ matrix.runner }}
          path: |
            ${{ env.FENCE_DIR }}/*.log
            ${{ env.FENCE_DIR }}/*.json

  # The network-on test needs PyPI and nodejs.org, so it is not a required
  # check: it shows whether the feature works, while the boundary is tested above.
  fence-network:
    name: Fence tier with the network on (not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      FENCE_DIR: /var/tmp/abhed-fence-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
      - name: Install python3-venv
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - name: Build the test binaries
        run: scripts/ci/fence-gated.sh build "$FENCE_DIR"
      - name: Allow user namespaces to those binaries, mount the alias, start the user manager
        run: scripts/ci/fence-gated.sh prepare "$FENCE_DIR"
      - name: The kernel offers what the fence needs
        run: scripts/ci/fence-gated.sh check "$FENCE_DIR"
      - name: Name resolution and package installs work under the fence
        run: |
          XDG_RUNTIME_DIR=/run/user/$(id -u)
          export XDG_RUNTIME_DIR
          systemd-run --user --scope --quiet -p Delegate=yes -- scripts/ci/fence-gated.sh run-network "$FENCE_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fence-network-logs
          path: |
            ${{ env.FENCE_DIR }}/*.log
            ${{ env.FENCE_DIR }}/*.json

  # The microVM driver boots real Firecracker VMs here, so the boundary its
  # docs describe is tested, not only the stand-in the unit tests use. The
  # runner must offer KVM: without /dev/kvm the job fails rather than skips.
  # Firecracker, the guest kernel and the Alpine base are fetched by
  # checksum, and the root filesystem is built with the script operators use.
  microvm-kvm:
    name: microVM driver on KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FC_VERSION: v1.17.0
      FC_SHA256: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
      KERNEL_URL: https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.15/x86_64/vmlinux-6.1.155
      KERNEL_SHA256: e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-3.24.2-x86_64.tar.gz
      ALPINE_SHA256: c5ca053cfe1d85c5b96dff8b9bc57045f7f184a30ffb6b65776409ca90388677
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
      - name: The runner offers KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm is missing: this runner cannot boot a microVM"
            exit 1
          fi
          ls -l /dev/kvm
      - name: Fetch Firecracker, the guest kernel and the Alpine base by checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mvm" && cd "$RUNNER_TEMP/mvm"
          curl -fsSL -o fc.tgz "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          echo "${FC_SHA256}  fc.tgz" | sha256sum -c -
          curl -fsSL -o vmlinux "$KERNEL_URL"
          echo "${KERNEL_SHA256}  vmlinux" | sha256sum -c -
          curl -fsSL -o alpine.tar.gz "$ALPINE_URL"
          echo "${ALPINE_SHA256}  alpine.tar.gz" | sha256sum -c -
          tar -xzf fc.tgz
          sudo install -o root -g root -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/local/bin/firecracker
          sudo install -o root -g root -m 0755 "release-${FC_VERSION}-x86_64/jailer-${FC_VERSION}-x86_64" /usr/local/bin/jailer
          chmod 0644 vmlinux
      - name: Build the guest agent and the root filesystem
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/mvm/abhed-guest" ./cmd/abhed-guest
          sudo scripts/microvm/build-rootfs.sh -b "$RUNNER_TEMP/mvm/alpine.tar.gz" -g "$RUNNER_TEMP/mvm/abhed-guest" -o "$RUNNER_TEMP/mvm/rootfs.ext4"
      - name: Real microVMs boot, run, copy back, reach only the proxy, and are recovered
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/mvm/mvm.test" ./driver/microvm/
          cd /tmp
          sudo ABHED_TEST_FIRECRACKER=1 \
            ABHED_TEST_FC_BINARY=/usr/local/bin/firecracker \
            ABHED_TEST_FC_JAILER=/usr/local/bin/jailer \
            ABHED_TEST_FC_KERNEL="$RUNNER_TEMP/mvm/vmlinux" \
            ABHED_TEST_FC_ROOTFS="$RUNNER_TEMP/mvm/rootfs.ext4" \
            "$RUNNER_TEMP/mvm/mvm.test" -test.run '^TestFirecrackerOnKVM$' -test.count=1 -test.v 2>&1 | tee "$RUNNER_TEMP/mvm/kvm.log"
          for t in TestFirecrackerOnKVM TestFirecrackerOnKVM/egress TestFirecrackerOnKVM/recover; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/mvm/kvm.log" || { echo "::error::$t did not run and pass"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: microvm-kvm-log
          path: ${{ runner.temp }}/mvm/kvm.log

  # Linux on Z. There is no s390x runner, so this cross-builds and vets every
  # package, then runs unit tests under qemu-user. That covers the seccomp
  # table against x/sys, the filter's big-endian argument layout, and code
  # that parses bytes; it cannot load a seccomp filter (qemu-user does not
  # implement seccomp), so the fence's gated tests need a real s390x kernel.
  s390x:
    name: Linux on Z (s390x), cross-built and emulated
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOOS: linux
      GOARCH: s390x
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
      - name: Install qemu-user for s390x
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          [ -e /proc/sys/fs/binfmt_misc/qemu-s390x ] || sudo systemctl restart systemd-binfmt
          test -e /proc/sys/fs/binfmt_misc/qemu-s390x
      - name: Embed the documentation
        run: python3 scripts/docsite/build.py --embed-only
      - name: go build
        run: go build ./... && go build -o /tmp/abhed ./cmd/abhed && file /tmp/abhed | grep -q 'IBM S/390'
      - name: go vet
        run: go vet ./...
      # Every package but app, whose terminal tests need a sandbox backend
      # and take too long emulated. Skipped, each for a gap in the emulator
      # or this runner, not in s390x, and each run natively in the test job:
      # qemu-user 8.2 drops stat's nanoseconds (the change-time tests) and has
      # no openat2 (TestBarred); timing budgets do not hold emulated; and
      # bubblewrap is not installed here (the sandboxed-session tests).
      - name: Unit tests under emulation
        run: |
          skip='^(TestReadableFileSameCatchesAChangeTimeAlone|TestFreshSeesEveryRewriteAndForgetsNothing|TestBrokenOperatorStoreRecovers'
          skip+='|TestBarred|TestSplitIsBoundedAndFailsClosed|TestBudgets|TestIndexScales'
          skip+='|TestSandboxedSessionRefusesALinkedStateFile|TestFirstRunEndpointNeverStoresAKey|TestFirstRunWithOllama)$'
          mapfile -t pkgs < <(go list ./... | grep -v '^github.com/zybuu-ai/abhed/app$')
          go test -count=1 -skip "$skip" "${pkgs[@]}"
      - name: The s390x table was checked on s390x
        run: |
          go test -count=1 -v -run 'TestNativeTableMatchesUnix|TestTablesMatchXSys' ./internal/fence/seccomp/ > table.log 2>&1 || { cat table.log; exit 1; }
          for t in TestNativeTableMatchesUnix TestTablesMatchXSys; do
            grep -q -- "--- PASS: $t" table.log || { echo "$t did not run and pass:"; cat table.log; exit 1; }
          done

  # Case-folding path tests skip on Linux; macOS folds case, so a skip here
  # means the check stopped running, and it fails the build.
  macos:
    name: macOS case-folding paths
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"

      # Each case-folding test runs alone by name, and `go test -json`
      # decides: any skip or a named test missing fails, whatever its message.
      - name: Path rules hold on a disk that folds case
        run: scripts/ci/case-fold.sh "$RUNNER_TEMP/case"

      # The Seatbelt profile is only exercised on macOS: every process-sandbox
      # boundary test must run here, none skipped.
      - name: Every process-sandbox boundary runs under Seatbelt
        run: |
          set -euo pipefail
          go test ./internal/sandbox/ -run 'ProcessSandbox|ReadableFile' -count=1 -v > seatbelt.log 2>&1 || { cat seatbelt.log; exit 1; }
          if grep -q -- "--- SKIP" seatbelt.log; then
            echo "a boundary test skipped under Seatbelt:"; grep -B3 -- "--- SKIP" seatbelt.log; exit 1
          fi
          for t in TestProcessSandboxRefusesANewGitFile TestProcessSandboxProtectsNestedRepositories \
                   TestProcessSandboxDeniesHomeSecretsThroughALink; do
            grep -q -- "--- PASS: $t " seatbelt.log || { echo "$t did not run and pass:"; grep -- "$t" seatbelt.log || true; exit 1; }
          done
          echo "$(grep -c -- "--- PASS" seatbelt.log) boundary tests ran under Seatbelt"

  # The container tier on a real engine: the hosted runner has Docker, so
  # the flags are checked by what they do, not only by what is passed.
  container-tier:
    name: Container tier on Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
      - name: Pull the sandbox image
        run: docker pull docker.io/library/debian:bookworm-slim
      - name: The container tier's boundaries hold on Docker
        run: |
          set -euo pipefail
          ABHED_REQUIRE_CONTAINER=1 go test ./internal/sandbox/ -run 'TestContainerTierOnARealEngine$' -count=1 -v > engine.log 2>&1 || { cat engine.log; exit 1; }
          grep -q -- "--- PASS: TestContainerTierOnARealEngine " engine.log || { echo "the engine test did not run and pass:"; cat engine.log; exit 1; }
      # Studio's interactive terminal on the container tier, where the engine
      # holds the shell's terminal and lines are judged by Abhed's prompt alone.
      - name: Studio's interactive terminal on the container tier
        run: |
          set -euo pipefail
          ABHED_REQUIRE_CONTAINER=1 go test ./app/ -run '^TestStudioInteractiveTerminalInAContainer$' -count=1 -v > term.log 2>&1 || { cat term.log; exit 1; }
          grep -q -- "--- PASS: TestStudioInteractiveTerminalInAContainer " term.log || { echo "the terminal test did not run and pass:"; cat term.log; exit 1; }

  # The docker and podman drivers, one long-lived container per sandbox, on
  # both engines; static, so the test binary can be bound in as the relay.
  container-drivers:
    name: Container drivers on ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
      - name: Pull the sandbox image
        run: ${{ matrix.engine }} pull docker.io/library/debian:bookworm-slim
      - name: The drivers' boundaries hold on ${{ matrix.engine }}
        env:
          CGO_ENABLED: "0"
          ABHED_REQUIRE_CONTAINER_DRIVER: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          go test ./driver/container/ -run 'OnARealEngine$' -count=1 -v > drivers.log 2>&1 || { cat drivers.log; exit 1; }
          for t in TestContainerDriverOnARealEngine TestContainerDriverMountsAttachCopyOnARealEngine TestContainerDriverAllowlistOnARealEngine; do
            grep -q -- "--- PASS: $t " drivers.log || { echo "$t did not run and pass:"; cat drivers.log; exit 1; }
          done

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg VERSION=v0.0.0-ci -t abhed:ci -f Dockerfile .
      - name: The image runs and reports its version
        run: docker run --rm --entrypoint /usr/local/bin/abhed abhed:ci -version | grep -F v0.0.0-ci

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lint, render every values file in the chart's ci/ folder, validate the
      # result against the Kubernetes schemas, and check the refusals; helm
      # and kubeconform are pinned and checksummed by the script.
      - name: Lint, render and validate the chart
        env:
          TOOLS_DIR: ${{ runner.temp }}/helm-tools
        run: scripts/ci/helm-check.sh deploy/helm/abhed

  security:
    name: CVE scans and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"

      - name: Embed the documentation
        run: python3 scripts/docsite/build.py --embed-only

      - name: Build the binary to scan
        run: go build -o abhed-scan ./cmd/abhed

      - name: Prepare
        run: mkdir -p scans

      # Source and binary reachability. A CVE this code can actually call
      # blocks; one present in a required module but never reached is
      # reported and does not fail the build.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > scans/govulncheck.json

      # Dependency and OS package CVEs in the tree.
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: scans/trivy-fs.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Build the image to scan
        run: docker build -t abhed:scan .

      # The shipped artefact, not just the source it was built from.
      - name: Trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: abhed:scan
          format: json
          output: scans/trivy-image.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # One report over every scan. Fails on a reachable CVE, on a HIGH or
      # CRITICAL in the tree or image, and on any scan that did not run —
      # a scanner that failed to execute must not read as a clean result.
      - name: Consolidate and gate
        run: python3 scripts/ci/security-report.py scans --out scans/report.md

      - name: Publish the report
        if: always()
        run: cat scans/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scans
          path: scans/

  # The macOS microVM helper is built, signed ad hoc with its entitlement and
  # the hardened runtime, and its protocol, refusals and signature checks are
  # tested against the real binary. Hosted macOS runners are VMs without
  # nested virtualization, so Virtualization.framework cannot start a VM on
  # them: the boot test (TestVZHelperBootsAMicroVM) runs on a real Mac, and
  # this job says so rather than claiming it ran.
  macos-vmhelper:
    name: macOS microVM helper (build, sign, protocol)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
      - name: Build without warnings, then build and sign ad hoc
        run: |
          set -euo pipefail
          xcrun swift --version
          xcrun swift build --package-path macos/abhed-vmhelper -c release -Xswiftc -warnings-as-errors
          scripts/macos/build-vmhelper.sh -o "$RUNNER_TEMP/abhed-vmhelper"
      - name: The helper speaks protocol 1, refuses what it must, and is checked before use
        run: |
          set -euo pipefail
          ABHED_TEST_VZ_HELPER="$RUNNER_TEMP/abhed-vmhelper" go test -race -count=1 -v ./driver/microvm/ 2>&1 | tee "$RUNNER_TEMP/vmhelper.log"
          for t in TestVZHelperWithoutBooting TestHelperSignatureIsChecked TestHelperBackendWithFakeHelper TestHelperRefusedWithoutAHelper TestHelperEndsWithItsDriver TestEgressThroughFakeHelper; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/vmhelper.log" || { echo "::error::$t did not run and pass"; exit 1; }
          done
      - name: Whether this runner can boot a VM
        run: |
          set -euo pipefail
          answer="$("$RUNNER_TEMP/abhed-vmhelper" check)"
          echo "$answer"
          echo "$answer" | grep -q '"protocol":1' || { echo "::error::check did not answer protocol 1"; exit 1; }
          if echo "$answer" | grep -q 'entitlement'; then
            echo "::error::the ad-hoc signed helper does not hold its entitlement"; exit 1
          fi
          echo "::notice::the boot test is not run on hosted macOS runners (no nested virtualization); run it on a Mac with ABHED_TEST_VZ=1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: macos-vmhelper-log
          path: ${{ runner.temp }}/vmhelper.log
