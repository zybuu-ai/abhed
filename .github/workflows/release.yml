# A release is a tag. Pushing v<major>.<minor>.<patch> builds one archive per
# platform with the documentation embedded, the microVM driver's
# abhed-microvm and abhed-guest for Linux, a checksum file covering all of
# them, and a multi-arch container image, and publishes them as a GitHub
# Release. Nothing is built by hand, so a release is reproducible from its
# tag. The macOS binaries are built with cgo on a macOS runner; every other
# platform is built without cgo on Linux.
#
# abhed-vmhelper, the macOS microVM helper, is deliberately not published
# yet: a copy others can run must be signed and notarized with the
# project's Developer ID (scripts/macos/sign-vmhelper.sh), whose
# certificate is not in this workflow. Add it here once it is.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: 1.52.0
  SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d

jobs:
  # The macOS binaries are built with cgo, so they can use the system's own
  # logging, and so on a Mac; both architectures come from the one runner.
  darwin:
    name: macOS binaries (cgo)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
      - name: Build
        run: scripts/build-release.sh -v "$GITHUB_REF_NAME" -o dist -p "darwin/arm64 darwin/amd64" -m ""
      - name: Each binary is for its architecture and links only the system's libraries
        run: |
          set -euo pipefail
          file "dist/abhed-$GITHUB_REF_NAME-darwin-arm64" | grep -q 'arm64'
          file "dist/abhed-$GITHUB_REF_NAME-darwin-amd64" | grep -q 'x86_64'
          for f in dist/abhed-*-darwin-arm64 dist/abhed-*-darwin-amd64; do
            if otool -L "$f" | tail -n +2 | grep -v -E '^\s+/usr/lib/|^\s+/System/Library/'; then
              echo "::error::$f links a library outside the system"; exit 1
            fi
          done
          "dist/abhed-$GITHUB_REF_NAME-darwin-arm64" -version | grep -F "$GITHUB_REF_NAME"
      # The checksums and signature are made once, over every platform, below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin
          path: dist/abhed-*
          if-no-files-found: error

  binaries:
    name: Binaries, SBOMs, checksums and signatures
    needs: darwin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The OIDC token is the signing identity; attestations stores provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
      - name: Install syft by checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft" && cd "$RUNNER_TEMP/syft"
          curl -fsSL -o syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: darwin
          path: dist
      # The Linux builds join the macOS ones in dist; the SBOMs and the
      # checksum file then cover every binary and archive there.
      - name: Build
        run: scripts/build-release.sh -v "$GITHUB_REF_NAME" -o dist -p "linux/amd64 linux/arm64 linux/s390x" -s
      # SHA256SUMS names every binary, archive and SBOM, so one signature
      # over it covers the release.
      - name: Sign the checksum file
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Build provenance for every file the checksum file names
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS
      # Published too, so provenance can be checked without the GitHub API.
      - name: Keep the provenance beside the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/abhed-${GITHUB_REF_NAME}.provenance.sigstore.json"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Abhed $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Verify a download: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/guide/01-getting-started.md#verify-a-download"

  image:
    name: Container image (linux/amd64, linux/arm64, linux/s390x), signed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # BuildKit attaches an SPDX SBOM and its own provenance to the image.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/s390x
          build-args: VERSION=${{ github.ref_name }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      # Signed by digest, never by tag: a tag can be moved after signing.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
