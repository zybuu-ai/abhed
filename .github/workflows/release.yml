# A release is a tag. Pushing v<major>.<minor>.<patch> builds one archive per
# platform with the documentation embedded, a checksum file, and a multi-arch
# container image, and publishes them as a GitHub Release. Nothing is built by
# hand, so a release is reproducible from its tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build
        run: scripts/build-release.sh -v "$GITHUB_REF_NAME" -o dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Abhed $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Verify a download with: sha256sum -c SHA256SUMS --ignore-missing"

  image:
    name: Container image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
