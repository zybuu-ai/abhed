{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# One volume, two folders: workspace (mounted at /workspace) and state
# (~/.abhed: accounts, keys, trust decisions), which the agent cannot reach.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "abhed.fullname" . }}
  labels:
    {{- include "abhed.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.persistence.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
