{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "abhed.fullname" . }}
  labels:
    {{- include "abhed.labels" . | nindent 4 }}
spec:
  {{- if toString .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ default 1 .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "abhed.selectorLabels" . | nindent 6 }}
{{- end }}
