# A LiteLLM proxy in front of a hosted model; watsonx is the example, and any
# LiteLLM provider works. Credentials come from the environment, and any
# ABHED_BENCH_* variable the rig does not publish is redacted from results.
# master_key is a placeholder: run as below, the proxy binds to 127.0.0.1.
# Run from this directory:
#   PYTHONPATH=. litellm --config litellm.example.yaml --host 127.0.0.1 --port 4000
# Export the same ABHED_BENCH_MAX_OUTPUT here as for rig.py, or the hook's
# limit and the one recorded in the run's plan differ.
model_list:
  - model_name: watsonx/openai/gpt-oss-120b
    litellm_params:
      model: watsonx/openai/gpt-oss-120b
      api_key: os.environ/ABHED_BENCH_WATSONX_APIKEY
      api_base: os.environ/ABHED_BENCH_WATSONX_URL
      space_id: os.environ/ABHED_BENCH_WATSONX_SPACE_ID
litellm_settings:
  callbacks: shim.shim
  drop_params: true
  num_retries: 2
  request_timeout: 600
general_settings:
  master_key: bench
